<style>
  :root{
    --bg:#07090b; --surface:#0e1216; --line:#18212b; --dim:#46545f;
    --fg:#c6d2dc; --bright:#f4f9fc; --accent:#22e0d0; --accent2:#ff4fa3;
    --warn:#ffb020; --hot:#ff3b3b; --ok:#4ade80;
    --plate:rgba(6,9,12,.62);          /* the same glass the instrument wears */
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono);
    overflow:hidden;
  }
  #bg{position:fixed;inset:0;z-index:0;opacity:.5}
  #viz{position:fixed;inset:0;z-index:0}
  #scan{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 4px);
    mix-blend-mode:multiply}
  #vig{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.8) 100%)}
  #wrap{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
    max-width:1100px;margin:0 auto;padding:16px 20px}
  #out{flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  #out::-webkit-scrollbar{width:8px}
  #out::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  #hud{padding:5px 9px;margin-bottom:8px;font-size:.92em;min-height:1.5em;
    background:var(--plate);border:1px solid var(--line);border-radius:5px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    white-space:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
    mask-image:linear-gradient(90deg,#000 92%,transparent);
    transition:opacity .3s}
  #hud::-webkit-scrollbar{display:none}
  #hud.loading{opacity:.55}
  .k:focus-visible,[data-cmd]:focus-visible{outline:1px solid var(--accent);
    outline-offset:2px;border-radius:3px}
  @media (max-width:560px){ #hud .opt{display:none} #hud{font-size:.85em} }
  .spin{display:inline-block;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .spin.go{transform:rotate(360deg)}
  #sug{position:absolute;left:0;right:0;bottom:100%;margin-bottom:4px;display:none;
    background:var(--bg,#07090b);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 -8px 30px rgba(0,0,0,.55);overflow:hidden;z-index:5}
  #sug.on{display:block}
  #sug div{padding:7px 12px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
  #sug div b{color:var(--accent);font-weight:normal;min-width:10ch}
  #sug div span{color:var(--dim);font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sug div.sel,#sug div:hover{background:rgba(34,224,208,.12)}
  #gobtn{display:none;font:inherit;color:var(--accent);background:none;
    border:1px solid var(--accent);border-radius:8px;padding:4px 12px;min-height:36px;
    touch-action:manipulation}
  @media (pointer: coarse){ #gobtn{display:inline-block} }
  #bar{position:relative}
  #hud [data-cmd]{cursor:pointer;border-bottom:1px solid rgba(34,224,208,.25)}
  #hud [data-cmd]:hover .a, #hud [data-cmd]:hover .dim{color:var(--bright)}
  #bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 9px;
    background:var(--plate);border:1px solid var(--line);border-radius:5px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  #ps1{color:var(--accent);white-space:nowrap}
  #in{flex:1;background:none;border:0;outline:0;color:var(--bright);
    font:inherit;caret-color:var(--accent)}
  .dim{color:var(--dim)} .b{color:var(--bright)} .a{color:var(--accent)}
  .a2{color:var(--accent2)} .w{color:var(--warn)} .ok{color:var(--ok)} .hot{color:var(--hot)}
  .row{display:flex;gap:10px;align-items:baseline}
  .k{color:var(--accent);min-width:22ch;display:inline-block}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(34,224,208,.3)}
  a:hover{color:var(--bright);border-color:var(--bright)}
  .big{font-size:min(2.6vw,15px);line-height:1.05;letter-spacing:.5px}
  .cursor{display:inline-block;width:8px;height:1em;background:var(--accent);
    vertical-align:-2px;animation:bl 1.1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  .grid{font-size:13px;letter-spacing:1px}
  .k,[data-cmd]{cursor:pointer}
  @media (max-width:640px){ body{font-size:12px} #wrap{padding:10px} .k{min-width:12ch} }
  @media (pointer: coarse){ #in,#bar{font-size:16px} #out .k,#out [data-cmd]{display:inline-block;padding:5px 0} }
  @media (prefers-reduced-motion:reduce){ #bg{display:none} .cursor{animation:none} }

<body>
<canvas id="bg"></canvas><canvas id="viz"></canvas>
<div id="scan"></div><div id="vig"></div>
<div id="wrap">
  <div id="hud"><span class="b">oontz</span> <span class="dim">· source code for music · … · </span><a href="https://oontz.sh" target="_blank" rel="noopener">open the real one →</a></div>
  <div id="out"></div>
  <div id="bar"><span id="ps1">oontz&nbsp;&gt;</span><input id="in" autocomplete="off" enterkeyhint="go"
    autocapitalize="off" spellcheck="false" aria-label="terminal input"><button id="gobtn" aria-label="run">▶</button></div>
</div>
<script src="copy.js"></script>
<script src="/engine/oontz.js"></script>
<script src="/engine/viz.js"></script>
<script>
"use strict";
const OUT = document.getElementById('out'), IN = document.getElementById('in');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function w(html, cls){ const d=document.createElement('div'); if(cls)d.className=cls;
  d.innerHTML=html; OUT.appendChild(d); OUT.scrollTop=OUT.scrollHeight; return d; }
function line(s='', cls){ return w(esc(s), cls); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function type(s, cls, speed=8){
  const d=w('',cls); for(const ch of s){ d.innerHTML+=esc(ch);
    OUT.scrollTop=OUT.scrollHeight; if(ch!==' ') await sleep(speed); } return d; }

/* ---------------------------------------------------------------- audio
   A small version of the real engine: everything is synthesized, nothing is
   sampled, and a pattern is a string. Same idea as the desktop tool, ~80 lines. */
let AC=null, master=null, playing=false, timer=null, step=0, bpm=138;
const P = {
  kick: "x...x...x...x...",
  hat:  "..x...x...x...x.",
  clap: "....x.......x...",
  bass: "x.x.x.x.x.x.x.x."
};
const NOTES=[55,55,65.4,55,73.4,55,65.4,49];
function ac(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.9;
    const lim=AC.createDynamicsCompressor();
    lim.threshold.value=-6; lim.ratio.value=12; lim.attack.value=.002; lim.release.value=.12;
    master.connect(lim); lim.connect(AC.destination); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function env(g,t,a,d,peak=1){ g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function kick(t,acc){ const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+.06);
  env(g,t,.002,acc?.5:.38,acc?1:.85); const s=c.createWaveShaper();
  s.curve=curve(acc?4:2.4); o.connect(s); s.connect(g); g.connect(master);
  o.start(t); o.stop(t+.6); }
function noise(t,dur){ const c=ac(),n=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; return s; }
function hat(t,open){ const c=ac(),s=noise(t,open?.32:.06),f=c.createBiquadFilter(),g=c.createGain();
  f.type='highpass'; f.frequency.value=8200; f.Q.value=.7;
  env(g,t,.001,open?.28:.045,.34); s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+.4); }
function clap(t){ const c=ac();
  for(let k=0;k<3;k++){ const s=noise(t,.02),f=c.createBiquadFilter(),g=c.createGain();
    f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.1;
    env(g,t+k*.011,.001,.03,.5); s.connect(f); f.connect(g); g.connect(master);
    s.start(t+k*.011); s.stop(t+k*.011+.06); }
  const s=noise(t,.16),f=c.createBiquadFilter(),g=c.createGain();
  f.type='bandpass'; f.frequency.value=1400; f.Q.value=.8;
  env(g,t,.002,.13,.32); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.25); }
function bass(t,hz,dur){ const c=ac(),o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(hz,t);
  f.type='lowpass'; f.Q.value=9;
  f.frequency.setValueAtTime(180+hz*8,t); f.frequency.exponentialRampToValueAtTime(140,t+dur*.9);
  env(g,t,.004,dur*.9,.32); o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+.05); }
function curve(k){ const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=Math.tanh(k*x)/Math.tanh(k); } return c; }

function tick(){
  const c=ac(), t=c.currentTime+.03, i=step%16;
  if(P.kick[i]&&P.kick[i]!=='.') kick(t,P.kick[i]==='X');
  if(P.hat[i%P.hat.length]&&P.hat[i%P.hat.length]!=='.') hat(t,P.hat[i%P.hat.length]==='O');
  if(P.clap[i]&&P.clap[i]!=='.') clap(t);
  const bi=i%P.bass.length;
  if(P.bass[bi]&&P.bass[bi]!=='.') bass(t,NOTES[(step>>1)%NOTES.length],60/bpm/2);
  drawGrid(i); step++;
}
function start(){ if(playing) return; ac(); playing=true; step=0;
  timer=setInterval(tick, 60/bpm/4*1000); tick(); }
function stop(){ playing=false; clearInterval(timer); timer=null; if(gridEl) gridEl.remove(), gridEl=null; }

/* ------------------------------------------------------------- live grid */
let gridEl=null;
function drawGrid(head){
  if(!gridEl){ gridEl=w('','grid'); }
  const names=['kick','hat','clap','bass'];
  let h='';
  for(const n of names){
    const pat=P[n], col={kick:'--hot',hat:'--accent',clap:'--accent2',bass:'--warn'}[n];
    let cells='';
    for(let i=0;i<16;i++){
      const ch=pat[i%pat.length]||'.';
      const on=ch!=='.';
      const cur=(i===head);
      const glyph=on?'█':'·';
      const style=on?`color:var(${col})`:'color:var(--dim)';
      cells+=`<span style="${style}${cur?';background:'+(on?`var(${col})`:'var(--line)')+';color:#000':''}">${glyph}</span>`
        + (i%4===3?' ':'');
    }
    h+=`<div><span class="dim">  ${n.padEnd(6)}</span>${cells}</div>`;
  }
  h+=`<div class="dim">  ${String(bpm)} BPM · bar ${Math.floor(step/16)+1} · type <span class="a">stop</span> to end</div>`;
  gridEl.innerHTML=h;
  OUT.scrollTop=OUT.scrollHeight;
}

/* ------------------------------------------------------- psychedelic bg */
const cv=document.getElementById('bg'), cx=cv.getContext('2d');
let W=0,H=0,tt=0;
function size(){ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
size(); addEventListener('resize',size);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){
  requestAnimationFrame(frame);
  if(reduce) return;
  tt+=playing?.02:.006;
  cx.fillStyle='rgba(8,10,12,.16)'; cx.fillRect(0,0,W,H);
  const cxx=W/2, cyy=H/2, R=Math.min(W,H)*.42;
  const beat = playing ? Math.max(0,1-((performance.now()/1000*bpm/60)%1)) : .25;
  const rings = 5;
  for(let r=0;r<rings;r++){
    const p=(tt*.5+r/rings)%1, rad=R*p*(1+beat*.12);
    cx.beginPath();
    for(let a=0;a<=64;a++){
      const th=a/64*Math.PI*2;
      const wob=1+Math.sin(th*(3+r)+tt*2)*.12*(1+beat);
      const x=cxx+Math.cos(th)*rad*wob, y=cyy+Math.sin(th)*rad*wob*.42;
      a?cx.lineTo(x,y):cx.moveTo(x,y);
    }
    cx.closePath();
    const hue=(tt*40+r*40)%360;
    cx.strokeStyle=`hsla(${hue},80%,60%,${(1-p)*.22*(playing?1:.45)})`;
    cx.lineWidth=(1.5+beat*2)*devicePixelRatio; cx.stroke();
  }
}
frame();

/* ---------------------------------------------------------------- shell */
const CP = window.OONTZ_COPY || {};

/* Render one copy block. {t:title} {s:sentence} {c:command,d:note} {} = blank */
function block(rows){
  line();
  (rows||[]).forEach(function(r){
    if(!r || (!r.t && !r.s && !r.c)) return line();
    if(r.t) return w(`<span class="${r.cls||'b'}">${esc(r.t)}</span>`);
    if(r.c) return w(`  <span class="a">${esc(r.c)}</span>`.padEnd(0) +
      `   <span class="dim">${esc(r.d||'')}</span>`);
    w(`<span class="${r.cls||''}">${esc(r.s)}</span>`);
  });
  line();
}

const LOGO = [
"   ▄▄▄   ▄▄▄  ▄▄▄▄▄ ▄▄▄▄▄ ▄▄▄▄▄▄",
"  █   █ █   █ █   █   █       ▄▀ ",
"  █   █ █   █ █   █   █     ▄▀   ",
"  █   █ █   █ █   █   █   ▄▀     ",
"   ▀▀▀   ▀▀▀  ▀   ▀   ▀   ▀▀▀▀▀▀"];

const CMDS = {
  help(){ line();
    (CP.help||[]).forEach(function(kv){
      w(`  <span class="k">${esc(kv[0])}</span><span class="dim">${esc(kv[1])}</span>`); });
    line(); },
  what(){ block(CP.what); },
  why(){ block(CP.why); },
  theory(){ block(CP.theory); },
  free(){ block(CP.free); },
  demo(){ line();
    w(`<span class="a">▸ playing.</span> <span class="dim">now change it: <span class="a">kick x...x..x.x...x</span> · <span class="a">hat ..x.x.x...x.x.x.</span> · <span class="a">bpm 150</span></span>`);
    start(); },
  stop(){ stop(); stopTrack(); line("▸ stopped.", 'dim'); },
  bpm(a){ const v=parseFloat(a[0]);
    if(!isFinite(v)||v<60||v>220) return line(CP.err_bpm||"bpm 60-220", 'w');
    bpm=v; if(playing){ clearInterval(timer); timer=setInterval(tick,60/bpm/4*1000); }
    line(`▸ ${bpm} BPM`, 'dim'); },
  open(a){ block(CP.open);
    /* `open` is an instruction, not a description of one. It also carries whatever is
       playing: reading about a track here and landing on an empty instrument there
       loses the one thing you came with. */
    const id = (a && a[0]) || (NOWPLAYING && NOWPLAYING.id) || '';
    const url = APP + (id ? '/?song=' + encodeURIComponent(id) : '/');
    let win = null;
    /* NOT window.open(...,'noopener') - that is specified to return null, so a blocked
       tab and a fine one look identical. Open, then sever the reference by hand. */
    try{ win = window.open(url, '_blank'); if(win) win.opener = null; }catch(e){}
    if(win) w(`  <span class="ok">▸ opened in a new tab</span>` +
              (id ? ` <span class="dim">· carrying ${esc((NOWPLAYING && NOWPLAYING.title) || id)}</span>` : ''));
    else w(`  <span class="dim">your browser held the tab back —</span> ` +
           `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)} →</a>`);
    line(); },
  tour(){
    TOURQ = [
      function(){ block(CP.tour_1); CMDS.demo(); },
      function(){ stop(); block(CP.tour_2); run('kick x...x...x...x..x'); },
      function(){ stop(); stopTrack(); block(CP.spec); },
      function(){ block(CP.tour_3); CMDS.gallery([]); },
      function(){ block(CP.tour_4); CMDS.charts(); },
    ];
    tourNext(); },
  async charts(){
    const d = w('<span class="dim">  reading the source graph…</span>');
    try{
      const r = await fetch(API+'/charts'); const j = await r.json(); d.remove();
      if(j.most_remixed && j.most_remixed.length){
        line('▸ most forked','b');
        j.most_remixed.slice(0,5).forEach(function(m){
          w('  <span data-cmd="tree '+esc(m.id)+'"><span class="a">'+esc(m.title)+'</span> <span class="dim">'+m.remixes+' flip'+(m.remixes>1?'s':'')+' · by '+esc(m.handle||'?')+' · tree</span></span>'); });
        line();
      }
      if(j.top_patterns && j.top_patterns.length){
        line('▸ most-shared patterns','b');
        j.top_patterns.forEach(function(p){
          w('  <span data-cmd="gallery pat '+esc(p.pat)+'"><span class="a">'+esc(p.pat)+'</span> <span class="dim">in '+p.count+' tracks · e.g. '+esc(p.example.title)+'</span></span>'); });
        line();
      }
      if(j.bpm && j.bpm.length){
        const max = Math.max.apply(null, j.bpm.map(function(b){ return b[1]; }));
        const bars = '▁▂▃▅▆▇';
        line('▸ tempo spread','b');
        j.bpm.forEach(function(b){
          const h = bars[Math.min(bars.length-1, Math.round((b[1]/max)*(bars.length-1)))];
          w('  <span class="dim">'+b[0]+'–'+(b[0]+9)+' BPM </span><span class="a">'+h.repeat(Math.max(1,b[1]))+'</span> <span class="dim">'+b[1]+'</span>'); });
        line();
      }
    }catch(e){ d.remove(); line('could not reach the api','w'); } },
  async tree(a){
    if(!a[0]) return line('tree <track id> — the remix family tree','w');
    try{
      const r = await fetch(API+'/songs/'+encodeURIComponent(a[0])+'/remixes');
      const j = await r.json();
      if(!r.ok) return line('▸ '+esc((j&&j.error)||'not found'),'w');
      line();
      j.ancestors.slice().reverse().forEach(function(p, i){
        w('  '+'  '.repeat(i)+'<span class="dim">↳</span> <span data-cmd="play '+esc(p.id)+'"><span class="a">'+esc(p.id)+'</span> '+esc(p.title)+'</span> <span class="dim">by '+esc(p.handle||'?')+'</span>'); });
      const base = j.ancestors.length;
      w('  '+'  '.repeat(base)+'<span class="b">● '+esc(a[0])+'</span> <span class="dim">this one</span>');
      j.remixes.forEach(function(k){
        w('  '+'  '.repeat(base+1)+'<span class="dim">↳</span> <span data-cmd="play '+esc(k.id)+'"><span class="a">'+esc(k.id)+'</span> '+esc(k.title)+'</span> <span class="dim">by '+esc(k.handle||'?')+(k.n?' · '+k.n+' further flip'+(k.n>1?'s':''):'')+'</span>'); });
      if(!j.remixes.length)
        w('  '+'  '.repeat(base+1)+'<span class="dim">no flips yet — `remix '+esc(a[0])+'` at oontz.sh would be the first</span>');
      line();
    }catch(e){ line('could not reach the api','w'); } },
  async gallery(a){
    /* structural search: read the music, not the metadata */
    if(a[0] === 'pat' && a[1]){
      const dp = w('<span class="dim">  reading the source of every public track…</span>');
      try{
        const rp = await fetch(API+'/search?pat='+encodeURIComponent(a[1])+(a[2]?'&track='+encodeURIComponent(a[2]):''));
        const jp = await rp.json(); dp.remove();
        if(!jp.songs || !jp.songs.length) return line('nobody plays that exact pattern yet. be first.','dim');

        return line();
      }catch(e){ dp.remove(); return line('could not reach the api','w'); }
    }
    if(a[0] === 'like' && a[1]){
      const dl = w('<span class="dim">  comparing structures…</span>');
      try{
        const rl = await fetch(API+'/similar/'+encodeURIComponent(a[1]));
        const jl = await rl.json(); dl.remove();
        if(!rl.ok) return line('▸ '+esc((jl&&jl.error)||'not found'),'w');
        if(!jl.songs.length) return line('nothing structurally close yet — this one is one of a kind','dim');

        jl.songs.forEach(function(sg){
          w(`  <span data-cmd="play ${esc(sg.id)}"><span class="a">${esc(sg.id)}</span> ${esc(sg.title)} <span class="dim">${Math.round(sg.score*100)}% · ${esc((sg.why||[]).join(', '))} · by ${esc(sg.handle||'?')}</span></span>`); });

      }catch(e){ dl.remove(); return line('could not reach the api','w'); }

    let flt = function(){ return true; }, n = a[0] ? 40 : 12;
    if(a[0]==='bpm' && a[1]){ const m=a[1].split('-'), lo=parseFloat(m[0]), hi=parseFloat(m[1]||m[0]);
      flt = function(sg){ return sg.bpm>=lo && sg.bpm<=(hi||lo); }; }
    if(a[0]==='key' && a[1]){ const k=a[1].toLowerCase(); flt = function(sg){ return String(sg.kkey||'').toLowerCase()===k; }; }
    try{

      w(`  <span class="dim">${'id'.padEnd(13)}${'track'.padEnd(20)}${'bpm'.padStart(5)}  ${'key'.padEnd(5)}${'len'.padStart(6)}${'plays'.padStart(7)}  by</span>`);
      j.songs.forEach(function(sg){

        w(`  <span data-cmd="play ${esc(sg.id)}"><span class="a">${esc(String(sg.id).padEnd(13))}</span>`+
          (sg.remix_of ? `<span class="dim">↻</span>` : ` `)+
          `<span class="b">${esc(String(sg.title).slice(0,20).padEnd(20))}</span>`+

    }catch(e){ d.remove(); block(CP.gallery_empty); }
  },
  clear(){ OUT.innerHTML=''; gridEl=null; },

  play(a){ return a[0] ? playTrack(a[0]) : CMDS.demo(); },

/* One Engine, made when first needed. The toy above and this never play together:
   playTrack stops the toy, and `stop` stops both. A playlist is a queue: the next
   track starts when this one has run its stated length. */
let E = null, EQ = [], EQi = 0, EQt = 0;
function stopTrack(){ if(E) E.stop(); EQ = []; if(EQt){ clearTimeout(EQt); EQt = 0; }
  if(window.OONTZ_VIZ){ OONTZ_VIZ.mode('off');     /* the show ends with the music */
    if(document.body.classList.contains('watching')) OONTZ_VIZ.watch(false); }
  if(NOWPLAYING){ NOWPLAYING = null; strip(); } }
async function playTrack(id, fromQueue){
  stop(); if(!fromQueue) EQ = [];
  if(EQt){ clearTimeout(EQt); EQt = 0; }
  const d = w('<span class="dim">  fetching the source…</span>');
  try{
    const r = await fetch(API + '/songs/' + encodeURIComponent(id));
    const j = await r.json(); d.remove();
    if(!r.ok || !j.data) return line('▸ ' + esc(j.detail||'not found'), 'w');
    if(!E){ E = new oontz.Engine();
      if(window.OONTZ_VIZ) OONTZ_VIZ.start(E);
    }
    if(window.OONTZ_VIZ) OONTZ_VIZ.mode('auto');   /* the canvas follows the transport */
    E.loadSong(j.data); E.play();
    NOWPLAYING = {id: id, title: j.title || id}; STRIP_TRIED = true; strip();
    w(`<span class="ok">▸ ${esc(j.title)}</span> <span class="dim">· ${Math.round(j.bpm||0)} BPM · ${esc(j.key||'?')}`+
      ` · by ${esc(j.by||'?')} · \`stop\` ends it</span>`);
    if(j.remix_of) w(`  <span class="dim">↻ a remix of <span class="b">${esc(j.remix_of.title)}</span> by ${esc(j.remix_of.handle||'?')} · play ${esc(j.remix_of.id)}</span>`);
    if(j.remixes) w(`  <span class="dim">↻ remixed ${j.remixes} time${j.remixes>1?'s':''} by other people</span>`);
    w(`  <span class="dim">${CP.play_note}</span> <a href="https://oontz.sh/?song=${encodeURIComponent(id)}" target="_blank" rel="noopener">oontz.sh/?song=${esc(id)}</a>`);
    if(EQ.length && EQi + 1 < EQ.length){
      const next = EQ[++EQi];
      EQt = setTimeout(function(){ playTrack(next.id, true); }, Math.max(5, j.seconds||120) * 1000);
    }
  }catch(e){ d.remove(); line('could not reach the api','w'); }
}
var API = "https://api.oontz.sh";

const ALIAS={'?':'help','ls':'help','start':'demo','about':'what',
  'sh':'open','app':'open','quit':'stop','exit':'stop','cls':'clear','music':'theory'};

/* -- the eggs -------------------------------------------------------------- */
async function eggOontz(){
  stop(); stopTrack(); start();                  /* kick only: the name IS the genre */
  P.hat=''; P.clap=''; P.bass=''; P.kick='x...x...x...x...';
  for(let i=0;i<8;i++){ w('<span class="a">oontz.</span>'); await sleep(60000/bpm); }
  stop(); block(CP.egg_oontz_done);
}

    KONAMI=[]; if(window.OONTZ_VIZ) OONTZ_VIZ.flare(10000);

function run(raw){
  const s=raw.trim(); if(!s) return;
  w(`<span class="a">oontz &gt;</span> ${esc(s)}`);
  const [v0,...args]=s.split(/\s+/); const v=ALIAS[v0.toLowerCase()]||v0.toLowerCase();
  if(v in P){ const pat=args[0]||'';
    if(!/^[xXoO.\-]+$/.test(pat)) return line("a pattern is made of x . and - — try  kick x...x...x...x...", 'w');
    P[v]=pat; line(`▸ ${v} ${pat}`, 'dim'); if(!playing) start(); return; }
  if(v==='oontz') return eggOontz();
  if(v==='sudo') return line(CP.egg_sudo,'w');
  if(s.toLowerCase().indexOf('boots and cats') === 0)
    return line('that is, verbatim, how techno is pronounced. the drum machine that says it: `open`.','ok');
  if(v === 'credits'){ line();
    [['every sound','arithmetic'],['every track here','its own source code'],
     ['you','the good part']].forEach(kv =>
      w('  <span class="dim">'+esc(kv[0])+'</span>  <span class="b">'+esc(kv[1])+'</span>'));
    line(); return; }
  if(CMDS[v]) return CMDS[v](args);
  const dym = didYouMean(v, Object.keys(CMDS));
  if(dym) return w('<span class="w">no `'+esc(v0)+'`. did you mean <span class="k">'+esc(dym)+'</span>?</span>');
  line(`${v0}: no such command. type help`, 'w');
}

/* -- history + the dropdown: the prompt earns its keys --------------------- */
let HIST = [], HI = 0, DRAFT = '';
try{ HIST = JSON.parse(localStorage.getItem('oontz_music_hist') || '[]'); }catch(e){}
HI = HIST.length;
const SUG = document.createElement('div'); SUG.id = 'sug';
document.getElementById('bar').appendChild(SUG);
const SUGS = {hits: [], i: -1};
function usageFor(v){
  const row = (CP.help || []).filter(kv => kv[0].split(' ')[0] === v)[0];
  return row ? row[1] : '';
}
function sugClose(){ SUGS.hits = []; SUGS.i = -1; SUG.classList.remove('on'); }
function sugRender(){
  if(!SUGS.hits.length) return sugClose();
  SUG.innerHTML = SUGS.hits.map((v, i) =>
    '<div data-v="'+esc(v)+'"'+(i === SUGS.i ? ' class="sel"' : '')+'><b>'+esc(v)+'</b><span>'+
    esc(usageFor(v))+'</span></div>').join('');
  SUG.classList.add('on');
}
function sugPick(v){ IN.value = v + ' '; sugClose(); IN.focus(); }
function lev(a, b){
  const m = a.length, n = b.length, row = [];
  for(let j = 0; j <= n; j++) row[j] = j;
  for(let i = 1; i <= m; i++){
    let prev = row[0]; row[0] = i;
    for(let k = 1; k <= n; k++){
      const cur = row[k];
      row[k] = Math.min(row[k] + 1, row[k-1] + 1, prev + (a[i-1] === b[k-1] ? 0 : 1));
      prev = cur;
    }
  }
  return row[n];
}
function didYouMean(v, verbs){
  if(v.length < 3) return null;
  let best = null, bestD = (v.length > 6 ? 2 : 1) + 1;
  verbs.forEach(w2 => {
    if(Math.abs(w2.length - v.length) >= bestD) return;
    const d = lev(v, w2);
    if(d < bestD){ bestD = d; best = w2; }
  });
  return bestD <= (v.length > 6 ? 2 : 1) ? best : null;
}
const LARGS = {gallery: ['pat','like','top'], tree: [], playlist: [], source: [],
               charts: [], watch: [], tour: []};
function argHits(verb, partial){
  const base = LARGS[verb];
  if(!base || !base.length) return [];
  return base.filter(a2 => a2.indexOf(partial) === 0 && a2 !== partial).slice(0, 6);
}
function suggest(){
  const parts = IN.value.trim().split(/\s+/), head = (parts[0] || '').toLowerCase();
  if(head && (parts.length === 2 || (parts.length === 1 && IN.value.slice(-1) === ' '))){
    const verb = ALIAS[head] || head;
    const ah = argHits(verb, (parts[1] || '').toLowerCase());
    if(ah.length){ SUGS.hits = ah.map(a2 => head + ' ' + a2);
      if(SUGS.i >= SUGS.hits.length) SUGS.i = -1;
      sugRender(); return; }
  }
  if(!head || parts.length > 1 || IN.value.slice(-1) === ' ') return sugClose();
  const verbs = Object.keys(CMDS).concat(Object.keys(ALIAS))
    .filter((v, i, a) => a.indexOf(v) === i).sort();
  SUGS.hits = verbs.filter(v => v.indexOf(head) === 0 && v !== head).slice(0, 6);
  if(SUGS.i >= SUGS.hits.length) SUGS.i = -1;
  sugRender();
}
SUG.addEventListener('pointerdown', e => {
  e.preventDefault();
  const d = e.target.closest('[data-v]'); if(d) sugPick(d.dataset.v);
});
IN.addEventListener('input', suggest);
IN.addEventListener('blur', sugClose);
document.getElementById('gobtn').addEventListener('click', function(){

});
/* paste a share link, get the command */
IN.addEventListener('paste', function(e){
  try{
    const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
    const m = txt.match(/\/t\/([A-Za-z0-9_-]{6,40})/);
    if(!IN.value && m){ e.preventDefault(); IN.value = 'play ' + m[1]; }
  }catch(err){}
});

/* -- the tour: Enter walks, anything else wanders off ---------------------- */
let TOURQ = [];
function tourNext(){
  const step = TOURQ.shift();
  if(!step) return;
  step();
  if(TOURQ.length) w('<span class="dim">  Enter continues the tour · type anything else to wander off</span>');
  else block(CP.tour_done);
}
IN.addEventListener('keydown', e=>{
  if(SUGS.hits.length){
    if(e.key === 'ArrowDown'){ e.preventDefault(); SUGS.i = (SUGS.i + 1) % SUGS.hits.length; sugRender(); return; }
    if(e.key === 'ArrowUp' && SUGS.i >= 0){ e.preventDefault(); SUGS.i--; sugRender(); return; }
    if((e.key === 'Enter' || e.key === 'Tab') && SUGS.i >= 0){ e.preventDefault(); sugPick(SUGS.hits[SUGS.i]); return; }
    if(e.key === 'Escape'){ e.preventDefault(); sugClose(); return; }
  }
  if(e.key==='Enter'){ const v=IN.value; IN.value=''; sugClose();
    if(v.trim()){ if(HIST[HIST.length-1] !== v.trim()) HIST.push(v.trim());
      if(HIST.length > 50) HIST.shift();
      try{ localStorage.setItem('oontz_music_hist', JSON.stringify(HIST)); }catch(err){} }
    HI = HIST.length; DRAFT = '';
    if(!v.trim() && TOURQ.length) return tourNext();
    if(v.trim() && TOURQ.length){ TOURQ = []; line(CP.tour_off,'dim'); }
    run(v); }
  else if(e.key==='ArrowUp'){ e.preventDefault();
    if(HI === HIST.length) DRAFT = IN.value;
    if(HI > 0){ HI--; IN.value = HIST[HI]; } }
  else if(e.key==='ArrowDown'){ e.preventDefault();
    if(HI < HIST.length){ HI++; IN.value = HI === HIST.length ? DRAFT : HIST[HI]; } }
});

/* -- the strip: the site says it is alive, with numbers -------------------- */
const HUD = document.getElementById('hud');
let STRIP_TRIED = false;
function tfetch(url){ const c = new AbortController(); setTimeout(function(){ c.abort(); }, 4000);
  return fetch(url, {signal: c.signal}); }
/* the same eight events the instrument fires, so the funnel is one report */
function ev(n, p){ try{ if(window.gtag) gtag('event', n, p || {}); }catch(e){} }
let NOWPLAYING = null;                        /* {id,title} while a track plays here */
async function strip(){
  await API_READY;                              /* never race the fallback probe */
  HUD.classList.add('loading');
  let bits = ['<span class="b">oontz</span> <span class="dim opt">· source code for music</span>'];
  if(NOWPLAYING) bits.unshift('<span data-cmd="stop"><span class="a">♪ '+esc(NOWPLAYING.title)+'</span> <span class="dim">stop</span></span>');
  try{
    const n = (await (await tfetch(API+'/gallery?limit_n=100')).json()).songs.length;
    bits.push('<span data-cmd="gallery"><span class="a">'+n+' tracks</span></span>');
  }catch(e){}
  try{
    const c = await (await tfetch(API+'/charts')).json();
    if(c.top_patterns && c.top_patterns.length)
      bits.push('<span data-cmd="gallery pat '+esc(c.top_patterns[0].pat)+'"><span class="dim">most shared</span> <span class="a">'+esc(c.top_patterns[0].pat)+'</span></span>');
    if(c.most_remixed && c.most_remixed.length)
      bits.push('<span class="opt" data-cmd="tree '+esc(c.most_remixed[0].id)+'"><span class="dim">most forked</span> <span class="a">'+esc(String(c.most_remixed[0].title).slice(0,18))+'</span></span>');
  }catch(e){}
  bits.push('<span data-cmd="charts"><span class="a">charts</span></span>');
  /* same continuity: if something is playing, the link takes it along */
  bits.push('<a href="https://oontz.sh/' +
    (NOWPLAYING && NOWPLAYING.id ? '?song=' + encodeURIComponent(NOWPLAYING.id) : '') +
    '" target="_blank" rel="noopener">open the real one →</a>');
  HUD.innerHTML = bits.join(' <span class="dim">·</span> ');
  HUD.classList.remove('loading');
  if(bits.length < 4 && !STRIP_TRIED){ STRIP_TRIED = true; setTimeout(strip, 6000); }  /* the API fallback may still be settling */
}
const COARSE = matchMedia('(pointer: coarse)').matches;
addEventListener('click', e=>{

     if(window.OONTZ_WATCH) setTimeout(function(){ if(window.OONTZ_VIZ) OONTZ_VIZ.watch(true); }, 800); };
   addEventListener('pointerdown', go); addEventListener('keydown', go);
   ev('share_open', {id: m.id || '', watch: window.OONTZ_WATCH ? 1 : 0});
 }})();
