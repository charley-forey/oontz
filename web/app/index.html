<meta charset="utf-8">

<title>oontz.sh — make techno in a terminal</title>
<meta name="description" content="A terminal instrument for making and mixing techno. Whole songs, two DJ decks, an AI that grades your arrangement. Free, runs in your browser.">
<style>
  :root{
    --bg:#07090b; --line:#24313d; --dim:#93a4b3; --fg:#dbe6f0; --bright:#ffffff;
    --accent:#3ff0e0; --accent2:#ff7ac0; --warn:#ffc247; --hot:#ff6b6b; --ok:#6ee79a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    /* Text sits over moving graphics, so every glyph carries its own dark halo.
       This is what makes it readable without hiding the art behind a slab. */
    --halo:0 0 3px rgba(4,6,8,.98), 0 0 9px rgba(4,6,8,.85), 0 1px 2px rgba(0,0,0,.95);
    --plate:rgba(6,9,12,.78);          /* dense panels get a plate as well as a halo */
    /* .62 plus backdrop-filter:blur(7px) was the old recipe on #hud, #rack and #bar.
       A blur re-runs whenever its backdrop changes, and the backdrop here is a canvas
       repainting every frame - three full re-blurs per frame, forever, on the same
       thread as your keystrokes. The denser plate reads the same over a soft glow. */
    --size:15px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
    font:var(--size)/1.55 var(--mono)}
  /* width/height 100% matter: a canvas is a REPLACED element, so inset:0 alone
     leaves it at its intrinsic 300x150 instead of stretching. With them, CSS keeps
     both canvases exactly viewport-sized through every keyboard and fullscreen
     change on its own, and JS only has to follow with the backing store. */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
  #viz{position:fixed;inset:0;width:100%;height:100%;z-index:1}
  /* Scanlines and vignette are FILM ON THE PICTURE, not on the words: they sit
     under #wrap. They used to be above it, multiplying 30% black through every
     glyph and dropping 80% black over the HUD and the prompt. */
  #scan{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px)}
  /* was mix-blend-mode:multiply. Over a near-black backdrop multiply and plain
     alpha are the same picture, but the blend made every canvas frame re-composite
     the entire page underneath it - which is what scroll and typing were queueing
     behind. */
  /* A light corner falloff, not a spotlight. At 72% over an ellipse this was the
     single biggest reason the art looked boxed in: on a wide screen the ellipse
     darkens exactly the left and right edges. */
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 70%,rgba(0,0,0,.34) 100%)}
  #wrap{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
    max-width:1180px;margin:0 auto;padding:14px 18px;text-shadow:var(--halo)}
  #hud{padding:5px 9px;margin-bottom:8px;font-size:.92em;min-height:1.5em;
    background:var(--plate);border:1px solid var(--line);border-radius:5px}
  /* The map used to pick its cell count from innerWidth/14 - a guess at how wide a
     character is. The guess ran ~40% short, so the song map stopped well before the
     right edge and left the panel black out there. Flex makes the cells share the
     real width: a wrong count now costs a little granularity and never any fit, and
     the map is always exactly one line at any orientation. */
  #hud .map{display:flex;align-items:stretch;margin-top:2px}
  #hud .sq{flex:1 1 auto;min-width:0;text-align:center;overflow:hidden}
  /* A terminal fills from the bottom: the spacer eats the slack so the first
     lines sit just above the prompt instead of floating in a void. */
  #out{flex:1;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;word-break:break-word;
    padding:2px 4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    overscroll-behavior:contain;display:flex;flex-direction:column}
  #out>#slack{margin-top:auto;flex:0 0 auto}
  #out::-webkit-scrollbar{width:9px}
  #out::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  /* The rack is STATIC: the live grid used to live inside the scrollback, which
     meant it scrolled away and every 16th note yanked you back to the bottom. */
  #rack{margin-top:6px;padding:6px 9px;background:var(--plate);border:1px solid var(--line);
    border-radius:5px;
    max-height:34vh;overflow-y:auto;scrollbar-width:thin;display:none}
  #rack.on{display:block}
  /* the palette: everything you can do, one fuzzy search away */
  #pal{position:fixed;inset:0;z-index:9;display:none;background:rgba(3,5,7,.72);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #pal.on{display:block}
  #palbox{max-width:640px;margin:9vh auto 0;background:rgba(8,12,16,.97);
    border:1px solid var(--accent);border-radius:8px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.75)}
  #palin{width:100%;background:none;border:0;outline:0;color:var(--bright);
    font:inherit;font-size:1.05em;padding:13px 15px;border-bottom:1px solid var(--line)}
  #pallist{max-height:52vh;overflow-y:auto;scrollbar-width:thin}
  .pi{padding:7px 15px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
  .pi.sel{background:rgba(63,240,224,.14)}
  .pi .pc{color:var(--accent);min-width:16ch;white-space:nowrap;flex:0 0 auto}
  .pi .pd{color:var(--dim);font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hud{cursor:pointer}
  #hint{min-height:1.35em;padding:2px 10px 0;font-size:.85em;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint b{color:var(--accent);font-weight:normal}
  #hint i{color:var(--bright);font-style:normal;background:rgba(63,240,224,.16);
    border-radius:3px;padding:0 3px}
  #sug{position:absolute;left:0;right:0;bottom:100%;margin-bottom:4px;display:none;
    background:var(--bg,#07090b);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 -8px 30px rgba(0,0,0,.55);
    overflow:hidden;z-index:5}
  #sug.on{display:block}
  #sug div{padding:7px 12px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
  #sug div b{color:var(--accent);font-weight:normal;min-width:11ch}
  #sug div span{color:var(--dim);font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sug div.sel,#sug div:hover{background:rgba(63,240,224,.12)}
  @media (pointer: coarse){ #sug div{padding:11px 12px} }
  #bar{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 9px;
    background:var(--plate);border:1px solid var(--line);border-radius:5px}
  #ps1{color:var(--accent2);white-space:nowrap}
  #in{flex:1;background:none;border:0;outline:0;color:var(--bright);font:inherit;
    caret-color:var(--accent2)}
  /* "jump to now" - shown only while you are reading history */
  #tail{position:absolute;right:26px;bottom:96px;z-index:5;display:none;cursor:pointer;
    padding:4px 11px;border:1px solid var(--accent);border-radius:14px;font-size:.85em;
    background:rgba(6,9,12,.9);color:var(--accent)}
  #tail.on{display:block}
  .dim{color:var(--dim)} .b{color:var(--bright)} .a{color:var(--accent)}
  .a2{color:var(--accent2)} .w{color:var(--warn)} .ok{color:var(--ok)} .hot{color:var(--hot)}
  .k{color:var(--accent);min-width:22ch;display:inline-block;cursor:pointer}
  .k:hover{color:var(--bright)}
  a{color:var(--accent);border-bottom:1px solid rgba(63,240,224,.45);text-decoration:none}
  a:hover{color:var(--bright)}
  .big{font-size:min(2.4vw,15px);line-height:1.05;letter-spacing:.5px}
  .grid{font-size:.95em;letter-spacing:1px}
  /* A row is a GRID, not a run of characters. `·` and `█` come from different
     fallback fonts on a phone, so counting on them to share an advance width put
     every rest half a cell left of its beat. A grid cell is a cell whatever glyph
     lands in it - and the 16 steps share the leftover width instead of leaving it
     black on the right. */
  #rack>div{display:grid;grid-template-columns:9ch repeat(16,minmax(0,1fr));
    align-items:center;line-height:1.5}
  #rack .st{cursor:pointer;touch-action:none;text-align:center;border-radius:2px}
  #rack .st:hover{outline:1px solid var(--accent)}
  /* A hit paints its whole cell instead of parking one narrow glyph in the middle
     of it. Once the row stretched to the full width the glyph stopped carrying it -
     and a filled cell is a bigger finger target, which is the point on a phone. */
  #rack .st.on{background:currentColor;color:transparent;text-shadow:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
  /* the downbeat of each beat, marked with a rule instead of a space: a space cost
     a whole column and still drifted; this costs none and cannot drift. A border,
     not a box-shadow - the filled pad above needs the shadow for its own outline. */
  #rack>div>*:nth-child(4n+2){border-left:1px solid var(--line)}
  /* Where a track's own pattern restarts. A 5-step hat against a 16-step kick is the
     whole point of polymeter and the grid could not show it: the wrap was invisible,
     so the one thing that makes the two patterns interesting was the one thing you
     could not see. Louder than a beat rule, because it is rarer and it explains more. */
  #rack .wrap{border-left:1px dashed var(--accent2)}
  /* The next section, in the bars before it lands. An outline in the track's own
     colour is a step arriving; a faded pad is one about to go. --tc carries the lane
     colour down so the cell can draw in it without another inline style. */
  #rack .arr{box-shadow:inset 0 0 0 1px var(--tc)}
  #rack .lea{opacity:.4}
  #rack>div.ghost{opacity:.65}
  #rack>div.ghost .trk{color:var(--accent2)}
  #rack .gst{text-align:center;border-radius:2px}
  #rack .trk{cursor:pointer;white-space:pre;overflow:hidden;text-overflow:ellipsis}
  /* `calm` for anyone who wants the words to win outright */
  body.calm #bg{opacity:.16} body.calm #viz{opacity:.2} body.calm #scan{display:none}
  body.calm #vig{background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
  body.calm{--plate:rgba(6,9,12,.86)}
  #stage{position:relative}
  #tight{position:absolute;top:3px;right:5px;z-index:3;font:inherit;font-size:.85em;
    line-height:1;color:var(--dim);background:var(--plate);border:1px solid var(--line);
    border-radius:4px;padding:3px 8px;min-height:26px;min-width:28px;cursor:pointer;
    touch-action:manipulation}
  #tight:hover{color:var(--accent);border-color:var(--accent)}
  /* Deck mode has no rack to collapse, so #tight's corner is free: the way out and
     the way to the prompt live there instead. Both have to be TAPPABLE - a phone can
     press neither M (there is no keyboard) nor Ctrl+K (there is no Ctrl). */
  #deckbar{position:absolute;top:3px;right:5px;z-index:3;display:none;gap:5px}
  body.deck #deckbar{display:flex}
  body.deck #tight{display:none}
  #deckbar button{font:inherit;font-size:.85em;line-height:1;color:var(--dim);
    background:var(--plate);border:1px solid var(--line);border-radius:4px;padding:3px 8px;
    min-height:26px;min-width:28px;cursor:pointer;touch-action:manipulation}
  #deckbar button:hover{color:var(--accent);border-color:var(--accent)}
  /* Collapsed: the map and the grid fold away and the terminal gets the room back.
     The HUD's one text line always stays - you never lose where you are in the song. */
  body.tight #rack{display:none}
  body.tight #hud .map{display:none}
  @media (max-width:640px){#wrap{padding:10px}.k{min-width:12ch}#rack{max-height:30vh}}
  /* A phone on its side is ~350px tall. Two fixed panels at 30vh plus a wrapped map
     left the scrollback about four lines high, so the instrument had nowhere to talk. */
  @media (max-height:520px) and (orientation:landscape){
    #wrap{padding:6px 10px}
    #hud{margin-bottom:4px;padding:3px 8px}
    #rack{max-height:38vh;margin-top:4px;padding:3px 8px}
    #hint{display:none}
  }
  /* A share button has to be a real button. navigator.share and the clipboard both
     want a live user gesture, and the await that mints a link has already spent the
     one that came from Enter - so the send action needs a fresh tap of its own. */
  .chip{font:inherit;font-size:.9em;color:var(--accent);background:none;cursor:pointer;
    border:1px solid var(--accent);border-radius:6px;padding:2px 10px;margin-left:8px;
    min-height:28px;touch-action:manipulation}
  .chip:hover{color:var(--bright);border-color:var(--bright)}
  #gobtn{display:none;font:inherit;color:var(--accent);background:none;
    border:1px solid var(--accent);border-radius:8px;padding:4px 12px;min-height:36px;
    touch-action:manipulation}
  @media (pointer: coarse){ #in,#bar{font-size:16px} #out .k{padding:5px 0} #gobtn{display:inline-block} }
  @media (prefers-reduced-motion:reduce){#bg{display:none}#viz{opacity:.35}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="viz"></canvas><div id="scan"></div><div id="vig"></div>
<div id="pal"><div id="palbox"><input id="palin" autocomplete="off" spellcheck="false"
  placeholder="what do you want to do?" aria-label="command palette"><div id="pallist"></div></div></div>
<div id="wrap">
  <div id="stage"><div id="hud"></div><button id="tight" aria-label="collapse the stage">−</button>
    <div id="deckbar"><button id="deckpal" aria-label="open the command palette">⌘</button><button
      id="deckx" aria-label="back to the studio">✕ studio</button></div></div>
  <div id="rack"></div>
  <div id="out"><div id="slack"></div></div>
  <div id="tail">↓ live</div>
  <div id="hint"></div>
  <div id="bar"><span id="ps1">oontz.sh&nbsp;&gt;</span><input id="in" autocomplete="off" enterkeyhint="go"
    autocapitalize="off" spellcheck="false" aria-label="terminal input"><button id="gobtn" aria-label="run">▶</button></div>
</div>
<script src="copy.js" defer></script>
<script src="legal.js" defer></script>
<script src="oontz.js" defer></script>
<script src="theory.js" defer></script>
<script src="ear.js" defer></script>
<script src="compose.js" defer></script>
<script src="viz.js" defer></script>
<script src="track.js" defer></script>
<script src="app.js" defer></script>
<script src="account.js" defer></script>
<script src="touch.js" defer></script>
<script src="mixer.js" defer></script>
<script src="midi.js" defer></script>
</body>
</html>
