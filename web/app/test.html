<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oontz — browser gate</title>
<style>
  body{background:#07090b;color:#dbe6f0;font:13px/1.5 ui-monospace,Consolas,monospace;margin:0;padding:16px}
  #frame{position:fixed;right:8px;bottom:8px;width:420px;height:280px;border:1px solid #24313d;opacity:.5}
  .ok{color:#6ee79a} .fail{color:#ff6b6b} .note{color:#93a4b3} h1{font-size:15px;color:#3ff0e0}
</style>
</head>
<body>
<h1>oontz browser gate</h1>
<div id="out">running…</div>
<iframe id="frame" src="index.html"></iframe>
<script>
/* The gate that needs a real browser.
 *
 * check.js covers the pure half - the song model, the key table, the FFT, the fix
 * ladder. Everything that needs a DOM or an AudioContext was verified by looking
 * at screenshots, which is how `kick x...x...x...x...` shipped broken on a cold
 * page and how every offbeat track measured as silence.
 *
 * This drives the REAL index.html in an iframe and asserts on what happens.
 * Run it headless:  python scripts/browsergate.py
 */
"use strict";
var OUT = document.getElementById("out"), PASS = 0, FAIL = 0, LINES = [];
var ERRORS = [];

function log(cls, s){ LINES.push('<div class="' + cls + '">' + s.replace(/</g, "&lt;") + "</div>"); }
function render(){ OUT.innerHTML = LINES.join(""); }

/* Each result goes back to the runner as it happens, so a hang still says which
   test hung. No in-page timeout: the runner holds the clock, because a timer here
   would be fast-forwarded by the browser and fire before the render it guards. */
function report(obj){
  try { navigator.sendBeacon("/report", new Blob([JSON.stringify(obj)], {type: "application/json"})); }
  catch(e){ try { fetch("/report", {method: "POST", body: JSON.stringify(obj)}); } catch(_e){} }
}
async function t(name, fn){
  try {
    var detail = await fn();
    PASS++; log("ok", "ok    " + name + (detail ? "   " + detail : ""));
    report({ok: true, name: name, detail: detail || ""});
  } catch (e) {
    FAIL++; log("fail", "FAIL  " + name + "   " + (e && e.message || e));
    report({ok: false, name: name, detail: String(e && e.message || e)});
  }
  render();
}
function ok(cond, msg){ if(!cond) throw new Error(msg); }
function eq(a, b, msg){ if(a !== b) throw new Error(msg + " (got " + a + ", want " + b + ")"); }
function near(a, b, tol, msg){ if(Math.abs(a - b) > tol) throw new Error(msg + " (got " + a + ", want ~" + b + ")"); }
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

async function until(fn, ms, what){
  var t0 = Date.now();
  while(Date.now() - t0 < (ms || 8000)){ if(fn()) return true; await sleep(40); }
  throw new Error("timed out waiting for " + (what || "condition"));
}

(async function main(){
  var F = document.getElementById("frame"), W = null;

  await t("the page boots", async function(){
    await until(function(){ return F.contentWindow && F.contentWindow.CMDS && F.contentWindow.E; }, 12000, "the app");
    W = F.contentWindow;
    W.onerror = function(m, s, l){ ERRORS.push(m + " @" + l); };
    W.addEventListener("unhandledrejection", function(e){ ERRORS.push("unhandled rejection: " + (e.reason && e.reason.message || e.reason)); });
    return Object.keys(W.CMDS).length + " commands";
  });

  await t("an AudioContext opens", function(){
    var c = W.E.start();
    ok(c, "no context");
    ok(W.E.master && W.E.filter && W.E.fx && W.E.analyser, "the master chain is incomplete");
    return c.sampleRate + " Hz";
  });

  /* ---- the cold start: this is what shipped broken --------------------- */
  await t("a voice name makes a track on a cold page", function(){
    W.run("kick x...x...x...x...");
    ok(W.E.tracks.kick, "no kick track");
    eq(W.E.tracks.kick.pat, "x...x...x...x...", "pattern not set");
    ok(W.E.order.indexOf("kick") >= 0, "kick not in order");
  });

  await t("play and stop with no song", function(){
    W.run("play"); ok(W.E.playing, "did not start");
    W.run("stop"); ok(!W.E.playing, "did not stop");
  });

  await t("the mixer verbs exist and apply", function(){
    W.run("hat ..x...x...x...x.");
    W.run("sidechain hat 0.7");
    near(W.E.tracks.hat.sc, 0.7, 1e-9, "sidechain");
    W.run("gain hat 0.5"); near(W.E.tracks.hat.gain, 0.5, 1e-9, "gain");
    W.run("pan hat -0.4"); near(W.E.tracks.hat.pan, -0.4, 1e-9, "pan");
  });

  await t("an unknown verb does not throw", function(){
    W.run("definitelynotacommand 1 2 3");
    W.run("kick zzzz");                       // an illegal pattern
  });

  /* ---- composing -------------------------------------------------------- */
  await t("compose builds a whole song", async function(){
    await W.CMDS.compose(["hardtechno", "1"]);
    W.E.stop();
    var sg = W.song;
    ok(sg && sg.order.length >= 5, "too few sections");
    ok(W.OONTZ_COMPOSE.score(W.OONTZ_COMPOSE.critique(sg)) >= 60, "arrangement graded badly");
    return sg.order.length + " sections, " + W.oontz.totalBars(sg) + " bars";
  });

  await t("phrase-length patterns really span bars", function(){
    var sg = W.song, long = null;
    sg.order.forEach(function(n){
      var sec = sg.sections[n];
      Object.keys(sec.tracks).forEach(function(k){
        var p = sec.tracks[k].pat;
        if(p && p.length > 16 && p.length % 16 === 0) long = long || {sec: n, k: k, p: p};
      });
    });
    ok(long, "the composer wrote no multi-bar pattern");
    var bars = long.p.length / 16;
    var a = W.oontz.patIndex(long.p, 0, 3), b = W.oontz.patIndex(long.p, bars - 1, 3);
    ok(a !== b, "patIndex gives the same step in different bars");
    return long.k + " spans " + bars + " bars";
  });

  /* ---- the ear: this needs a real render -------------------------------- */
  await t("the ear renders and measures every track", async function(){
    var m = await W.OONTZ_EAR.measure(W.song);
    ok(m.order.length >= 3, "measured too few tracks");
    var silent = m.order.filter(function(n){
      return m.tracks[n].reduce(function(a, b){ return a + b; }, 0) < 0.5; });
    ok(!silent.length, "these measured as silence: " + silent.join(", "));
    ok(m.master.peakDb < 0, "master peaked at " + m.master.peakDb.toFixed(2) + " dBFS");
    W.EARLAST = m;
    return m.order.length + " tracks, peak " + m.master.peakDb.toFixed(2) + " dBFS";
  });

  await t("the master chain enforces its own rules", async function(){
    var m = W.EARLAST;
    ok(m.master.peakDb <= -0.5, "no headroom: " + m.master.peakDb.toFixed(2) + " dBFS");
    ok(m.master.low.ratio < 0.08, "low end is not mono: " + m.master.low.ratio.toFixed(3));
    /* nothing but the low-end owners should have real sub energy */
    m.order.forEach(function(n){
      if(W.oontz.keepsLows(n)) return;
      ok(m.tracks[n][0] < 0.30, n + " has " + Math.round(m.tracks[n][0] * 100) + "% under 60Hz despite the highpass");
    });
    return "headroom, mono lows and the 60Hz highpass all hold";
  });

  await t("grade prints both halves", async function(){
    var before = W.document.getElementById("out").textContent.length;
    await W.CMDS.grade([]);
    var txt = W.document.getElementById("out").textContent.slice(before);
    ok(/arrangement \d+\/100/.test(txt), "no arrangement score");
    ok(/the mix — \d+\/100/.test(txt), "no mix score");
    ok(/dBFS/.test(txt), "no measured headroom");
  });

  await t("improve raises the mix and stops", async function(){
    var m0 = await W.OONTZ_EAR.measure(W.song);
    var s0 = W.OONTZ_COMPOSE.score(W.OONTZ_EAR.critiqueMix(m0));
    await W.CMDS.improve(["2"]);
    var m1 = await W.OONTZ_EAR.measure(W.song);
    var s1 = W.OONTZ_COMPOSE.score(W.OONTZ_EAR.critiqueMix(m1));
    ok(s1 >= s0, "improve made it worse: " + s0 + " -> " + s1);
    return s0 + " -> " + s1 + "/100";
  });

  /* ---- export ----------------------------------------------------------- */
  await t("export renders a playable WAV", async function(){
    var r = await W.oontz.renderSong(W.song);
    var blob = W.oontz.wavBlob(r.buf);
    ok(blob.size > 44, "empty wav");
    var head = new Uint8Array(await blob.slice(0, 44).arrayBuffer());
    var tag = String.fromCharCode(head[0], head[1], head[2], head[3]);
    eq(tag, "RIFF", "not a RIFF file");
    eq(String.fromCharCode(head[8], head[9], head[10], head[11]), "WAVE", "not WAVE");
    var ch = head[22] | (head[23] << 8), bits = head[34] | (head[35] << 8);
    eq(ch, r.buf.numberOfChannels, "channel count in the header is wrong");
    eq(bits, 16, "not 16-bit");
    var dataLen = head[40] | (head[41] << 8) | (head[42] << 16) | (head[43] << 24);
    eq(dataLen, r.buf.length * ch * 2, "data chunk length is wrong");
    eq(blob.size, 44 + dataLen, "file size does not match its header");
    return (blob.size / 1048576).toFixed(1) + " MB, " + r.seconds.toFixed(1) + "s";
  });

  /* ---- decks: never executed before ------------------------------------- */
  await t("a deck loads and reports a grid", async function(){
    await W.CMDS.dload(["a", "this"]);
    var D = W.E.decks();
    ok(D.a.r && D.a.r.buf, "deck A has no buffer");
    ok(D.a.r.grid.length >= 8, "no beat grid");
    near(D.a.r.grid[4] - D.a.r.grid[0], 4 * 60 / D.a.r.bpm, 1e-6, "the grid is not four beats to the bar");
    return D.a.r.grid.length + " beats, " + D.a.r.seconds.toFixed(1) + "s";
  });

  await t("two decks sync to the same phase", async function(){
    await W.CMDS.compose(["acid", "1"]); W.E.stop();
    await W.CMDS.dload(["b", "this"]);
    var D = W.E.decks();
    ok(D.b.r, "deck B has no buffer");
    D.a.play(); D.b.play();
    W.CMDS.deck(["b", "sync"]);
    var now = W.E.ctx.currentTime + 0.05;
    near(D.b.phaseAt(now), D.a.phaseAt(now), 0.002, "phase does not match after sync");
    near(D.b.bpm(), D.a.bpm(), 0.01, "tempo does not match after sync");
    D.a.stop(); D.b.stop();
    return "rate " + D.b.rate.toFixed(4);
  });

  await t("eq kills and the crossfader moves", function(){
    W.CMDS.eq(["a", "low", "0"]);
    ok(W.E.decks().a.kill.low, "kill flag not set");
    W.CMDS.xf(["0"]);
    var g = W.oontz.xfGains(W.E.decks().xf);
    near(g[0], g[1], 1e-9, "centre is not equal");
    W.CMDS.xf(["-1"]);
    near(W.oontz.xfGains(W.E.decks().xf)[0], 1, 1e-9, "hard left is not all A");
  });

  await t("a deck loop wraps and unloops", function(){
    var d = W.E.decks().a;
    d.loopBeats(4); ok(d.loop, "no loop set");
    var len = d.loop[1] - d.loop[0];
    near(len, 4 * 60 / d.r.bpm, 1e-6, "loop is not four beats");
    d.loopBeats(0); ok(!d.loop, "loop did not clear");
  });

  await t("deck mode switches and comes back", function(){
    W.CMDS.mode(["deck"]); eq(W.MODE, "deck", "did not enter deck mode");
    ok(W.document.getElementById("hud").textContent.indexOf("A") >= 0, "deck HUD did not draw");
    W.CMDS.mode(["studio"]); eq(W.MODE, "studio", "did not return to studio");
  });

  /* ---- the keyboard ----------------------------------------------------- */
  await t("keys perform when the prompt is blurred", function(){
    W.IN.blur();
    W.E.focus = "kick";
    var before = W.E.tracks.kick.pat;
    W.dispatchEvent(new W.KeyboardEvent("keydown", {key: "w", bubbles: true}));
    ok(W.E.tracks.kick.pat !== before, "the pad key did nothing");
    W.dispatchEvent(new W.KeyboardEvent("keydown", {key: "/", bubbles: true}));
    ok(W.E.roll, "the roll did not engage");
    W.dispatchEvent(new W.KeyboardEvent("keyup", {key: "/", bubbles: true}));
    ok(!W.E.roll, "the roll did not release");
  });

  await t("a rate effect schedules without throwing", function(){
    W.E.rateFx(function(t){ return -1.5 * Math.exp(-t / 0.35); }, 1.2);
    ok(W.E.fx.delayTime.value >= 0, "delay time went negative");
  });

  /* ---- the interface ---------------------------------------------------- */
  await t("the palette opens and matches fuzzily", function(){
    W.openPal();
    ok(W.document.getElementById("pal").classList.contains("on"), "palette did not open");
    W.PALIN.value = "compac"; W.palRender();
    ok(W.PALROWS.length, "no matches");
    ok(/compose acid/.test(W.PALROWS[0][0]), "fuzzy match put " + W.PALROWS[0][0] + " first");
    W.closePal();
    ok(!W.document.getElementById("pal").classList.contains("on"), "palette did not close");
  });

  await t("the section map scrubs", function(){
    W.E.jump(0);
    var sq = W.document.querySelectorAll("#hud .sq");
    ok(sq.length > 4, "the map drew no cells");
    var last = sq[sq.length - 1];
    last.dispatchEvent(new W.PointerEvent("pointerdown", {bubbles: true}));
    ok(W.E.songbar > 0, "clicking the map did not move the playhead");
  });

  await t("the rack is clickable and writes through", function(){
    var st = W.document.querySelector("#rack .st");
    ok(st, "the rack drew no steps");
    var name = st.dataset.t, i = +st.dataset.i;
    var before = W.E.tracks[name].pat;
    st.dispatchEvent(new W.MouseEvent("click", {bubbles: true}));
    ok(W.E.tracks[name].pat !== before, "clicking a step changed nothing");
  });

  await t("the rack shows the next section before it lands", function(){
    /* build has no bass and a 5-step hat; the drop brings a bass and busies the kick.
       Two bars out, the grid must already say so - that is the whole point of it. */
    var mk = function(b, r, tr){ return {bars: b, role: r, energy: .7, tracks: tr,
                                         order: Object.keys(tr)}; };
    var build = {kick: {voice: "kick", pat: "x...x...x...x...", gain: 1},
                 hat:  {voice: "hat",  pat: "..x.x", gain: .8}};
    var drop  = {kick: {voice: "kick", pat: "x..xx...x...x...", gain: 1},
                 hat:  {voice: "hat",  pat: "..x.x", gain: .8},
                 bass: {voice: "bass", pat: "x.x.x.x.x.x.x.x.", gain: .9}};
    W.loadSong({format: "oontz-song-1", name: "look", bpm: 140, key: "a", scale: "minor",
                order: ["build", "drop"],
                sections: {build: mk(16, "build", build), drop: mk(16, "drop", drop)}},
               "lookahead test");
    W.E.stop();

    W.E.jump(2); W.draw();                       /* far from the boundary: nothing yet */
    ok(!W.document.querySelector("#rack .arr"), "lookahead showed 14 bars early");
    ok(!W.document.querySelector("#rack .ghost"), "a ghost lane showed 14 bars early");

    W.E.jump(14); W.draw();                      /* two bars out: it must be there */
    var arr = W.document.querySelectorAll("#rack .arr");
    ok(arr.length > 0, "no arriving step marked two bars before the drop");
    var ghost = W.document.querySelector("#rack .ghost");
    ok(ghost, "the drop's bass got no ghost lane");
    ok(/bass/.test(ghost.textContent), "the ghost lane is not the bass");
    ok(!ghost.querySelector("[data-t]"), "a ghost lane must not be editable");

    /* the 5-step hat wraps inside the bar - the one thing the grid could never show */
    var rows = W.document.querySelectorAll("#rack > div");
    var hatRow = null;
    for(var r = 0; r < rows.length; r++)
      if(/hat/.test(rows[r].textContent)) hatRow = rows[r];
    ok(hatRow, "no hat lane");
    ok(hatRow.querySelectorAll(".wrap").length === 3, "a 5-step pattern wraps 3 times in 16");

    W.E.jump(16); W.draw();                      /* inside the drop: the bass is real now */
    ok(!W.document.querySelector("#rack .ghost"), "the ghost outlived its section");
    return arr.length + " arriving, 3 wraps";
  });

  /* ---- Phase 3: arrangement, library, undo, stems ---------------------- */
  await t("sec edits the arrangement", async function(){
    await W.CMDS.compose(["techno", "1"]); W.E.stop();
    var n0 = W.song.order.length, bars0 = W.oontz.totalBars(W.song);
    W.run("sec add drop 16");
    eq(W.song.order.length, n0 + 1, "sec add did not add a section");
    ok(W.oontz.totalBars(W.song) > bars0, "bars did not grow");
    var added = W.song.order.filter(function(x){ return W.song.sections[x].role === "drop"; }).pop();
    W.run("sec len " + added + " 32");
    eq(W.song.sections[added].bars, 32, "sec len did not resize");
    W.run("sec move " + added + " 1");
    eq(W.song.order[0], added, "sec move did not reorder");
    W.run("sec del " + added);
    eq(W.song.order.length, n0, "sec del did not remove");
    return n0 + " sections, add/len/move/del all took";
  });

  await t("sec keeps sections phrase-aligned", function(){
    W.run("sec add build 13");                    // not a multiple of 8
    var b = W.song.order.filter(function(x){ return W.song.sections[x].role === "build"; }).pop();
    eq(W.song.sections[b].bars % 8, 0, "sec add accepted " + W.song.sections[b].bars + " bars");
    W.run("sec del " + b);
  });

  await t("undo covers a typed edit, not just the AI", function(){
    var before = W.song.sections[W.song.order[0]].tracks.kick.pat;
    W.run("kick x.x.x.x.x.x.x.x.");
    var after = W.E.tracks.kick.pat;
    ok(after !== before, "the edit did not apply");
    W.run("undo");
    eq(W.song.sections[W.song.order[0]].tracks.kick.pat, before, "undo did not restore the typed edit");
  });

  await t("undo covers a mixer verb", function(){
    var g0 = W.E.tracks.hat ? (W.E.tracks.hat.gain == null ? 1 : W.E.tracks.hat.gain) : null;
    if(g0 === null) return "no hat in this song";
    W.run("gain hat 0.33");
    W.run("undo");
    near(W.E.tracks.hat.gain == null ? 1 : W.E.tracks.hat.gain, g0, 1e-9, "undo did not restore gain");
  });

  await t("the local library saves and loads by name", function(){
    W.run("name gate-test");
    W.run("save gate-test");
    var bars = W.oontz.totalBars(W.song);
    W.run("compose acid 1");
    W.run("load gate-test");
    eq(W.song.name, "gate-test", "load did not restore the saved song");
    eq(W.oontz.totalBars(W.song), bars, "the restored song has a different length");
    W.run("forget gate-test");
    return "saved, switched away, loaded back";
  });

  await t("export stems renders one channel per track", async function(){
    /* the loudest section, where everything is playing - an intro is mostly
       silence by design, and silent stems are correct there */
    var loud = W.OONTZ_EAR.loudestSection(W.song);
    var bar = W.OONTZ_EAR.barOfSection(W.song, loud.name);
    var per = await W.oontz.renderTracks(W.song, {bar: bar});
    /* The count depends on the section; what must hold is that every audible
       track gets exactly one channel and none of them come back silent. */
    var st = W.oontz.stateAt(W.song, bar);
    var audible = st.order.filter(function(n){
      var t = st.tracks[n];
      return t && t.pat && !t.mute && t.pat.replace(/[.\-]/g, "").length; });
    ok(per.names.length >= 2, "only " + per.names.length + " stems in " + loud.name);
    eq(per.names.length, Math.min(32, audible.length), "stems do not match the audible tracks");
    eq(per.buf.numberOfChannels, per.names.length, "channels do not match track count");
    var quiet = per.names.filter(function(n, i){
      var d = per.buf.getChannelData(i), peak = 0;
      for(var k = 0; k < d.length; k++){ var a2 = d[k] < 0 ? -d[k] : d[k]; if(a2 > peak) peak = a2; }
      return peak < 1e-4;
    });
    ok(!quiet.length, "these stems are silent: " + quiet.join(", "));
    return per.names.length + " stems of " + loud.name + ": " + per.names.join(", ");
  });

  await t("why answers from the theory", function(){
    var before = W.document.getElementById("out").textContent.length;
    W.run("why sidechain");
    var txt = W.document.getElementById("out").textContent.slice(before);
    ok(/ducks/.test(txt), "no explanation printed");
  });

  await t("learn starts and tracks progress", function(){
    W.CMDS.learn();
    eq(W.LESSON_AT, 0, "lesson did not start");
    var txt = W.document.getElementById("out").textContent;
    ok(/1\/\d/.test(txt), "no step counter");
  });

  await t("the log sticks to the bottom only when you are there", function(){
    var out = W.document.getElementById("out");
    out.scrollTop = 0;
    W.line("a new line while scrolled up");
    ok(out.scrollTop === 0, "the log yanked itself to the bottom");
    ok(W.document.getElementById("tail").classList.contains("on"), "no jump-to-live offered");
    W.tail();
    ok(!W.document.getElementById("tail").classList.contains("on"), "the tail button stayed up");
  });

  await t("calm and text size persist", function(){
    W.run("calm"); ok(W.document.body.classList.contains("calm"), "calm did not apply");
    W.run("calm off"); ok(!W.document.body.classList.contains("calm"), "calm did not clear");
    W.run("text 18");
    eq(W.document.documentElement.style.getPropertyValue("--size"), "18px", "text size did not apply");
    W.run("text 15");
  });

  await t("recording starts and produces data", async function(){
    if(!W.MediaRecorder) return "MediaRecorder not available in this browser";
    W.E.play();
    await W.CMDS.rec([]);
    ok(W.REC, "recorder did not start");
    await sleep(500);
    W.REC.stop();
    await sleep(400);
    W.E.stop();
    ok(!W.REC, "recorder did not clear on stop");
    return "started and stopped cleanly";
  });

  await t("nothing threw along the way", function(){
    ok(!ERRORS.length, ERRORS.join(" | "));
  });

  log("note", "");
  log(FAIL ? "fail" : "ok", "OONTZ-GATE " + (FAIL ? "FAIL" : "PASS") + " pass=" + PASS + " fail=" + FAIL);
  render();
  document.title = "OONTZ-GATE " + (FAIL ? "FAIL" : "PASS");
  report({done: true, pass: PASS, fail: FAIL});
})();
</script>
</body>
</html>
