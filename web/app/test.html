<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oontz — browser gate</title>
<style>
  body{background:#07090b;color:#dbe6f0;font:13px/1.5 ui-monospace,Consolas,monospace;margin:0;padding:16px}
  #frame{position:fixed;right:8px;bottom:8px;width:420px;height:280px;border:1px solid #24313d;opacity:.5}
  .ok{color:#6ee79a} .fail{color:#ff6b6b} .note{color:#93a4b3} h1{font-size:15px;color:#3ff0e0}
</style>
</head>
<body>
<h1>oontz browser gate</h1>
<div id="out">running…</div>
<iframe id="frame" src="index.html"></iframe>
<script>
/* The gate that needs a real browser.
 *
 * check.js covers the pure half - the song model, the key table, the FFT, the fix
 * ladder. Everything that needs a DOM or an AudioContext was verified by looking
 * at screenshots, which is how `kick x...x...x...x...` shipped broken on a cold
 * page and how every offbeat track measured as silence.
 *
 * This drives the REAL index.html in an iframe and asserts on what happens.
 * Run it headless:  python scripts/browsergate.py
 */
"use strict";
var OUT = document.getElementById("out"), PASS = 0, FAIL = 0, LINES = [];
var ERRORS = [];

function log(cls, s){ LINES.push('<div class="' + cls + '">' + s.replace(/</g, "&lt;") + "</div>"); }
function render(){ OUT.innerHTML = LINES.join(""); }

/* Each result goes back to the runner as it happens, so a hang still says which
   test hung. No in-page timeout: the runner holds the clock, because a timer here
   would be fast-forwarded by the browser and fire before the render it guards. */
function report(obj){
  try { navigator.sendBeacon("/report", new Blob([JSON.stringify(obj)], {type: "application/json"})); }
  catch(e){ try { fetch("/report", {method: "POST", body: JSON.stringify(obj)}); } catch(_e){} }
}
async function t(name, fn){
  try {
    var detail = await fn();
    PASS++; log("ok", "ok    " + name + (detail ? "   " + detail : ""));
    report({ok: true, name: name, detail: detail || ""});
  } catch (e) {
    FAIL++; log("fail", "FAIL  " + name + "   " + (e && e.message || e));
    report({ok: false, name: name, detail: String(e && e.message || e)});
  }
  render();
}
function ok(cond, msg){ if(!cond) throw new Error(msg); }
function eq(a, b, msg){ if(a !== b) throw new Error(msg + " (got " + a + ", want " + b + ")"); }
function near(a, b, tol, msg){ if(Math.abs(a - b) > tol) throw new Error(msg + " (got " + a + ", want ~" + b + ")"); }
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

async function until(fn, ms, what){
  var t0 = Date.now();
  while(Date.now() - t0 < (ms || 8000)){ if(fn()) return true; await sleep(40); }
  throw new Error("timed out waiting for " + (what || "condition"));
}

(async function main(){
  var F = document.getElementById("frame"), W = null;

  await t("the page boots", async function(){
    await until(function(){ return F.contentWindow && F.contentWindow.CMDS && F.contentWindow.E; }, 12000, "the app");
    W = F.contentWindow;
    W.onerror = function(m, s, l){ ERRORS.push(m + " @" + l); };
    W.addEventListener("unhandledrejection", function(e){ ERRORS.push("unhandled rejection: " + (e.reason && e.reason.message || e.reason)); });
    return Object.keys(W.CMDS).length + " commands";
  });

  await t("an AudioContext opens", function(){
    var c = W.E.start();
    ok(c, "no context");
    ok(W.E.master && W.E.filter && W.E.fx && W.E.analyser, "the master chain is incomplete");
    return c.sampleRate + " Hz";
  });

  /* ---- the cold start: this is what shipped broken --------------------- */
  await t("a voice name makes a track on a cold page", function(){
    W.run("kick x...x...x...x...");
    ok(W.E.tracks.kick, "no kick track");
    eq(W.E.tracks.kick.pat, "x...x...x...x...", "pattern not set");
    ok(W.E.order.indexOf("kick") >= 0, "kick not in order");
  });

  await t("play and stop with no song", function(){
    W.run("play"); ok(W.E.playing, "did not start");
    W.run("stop"); ok(!W.E.playing, "did not stop");
  });

  await t("the mixer verbs exist and apply", function(){
    W.run("hat ..x...x...x...x.");
    W.run("sidechain hat 0.7");
    near(W.E.tracks.hat.sc, 0.7, 1e-9, "sidechain");
    W.run("gain hat 0.5"); near(W.E.tracks.hat.gain, 0.5, 1e-9, "gain");
    W.run("pan hat -0.4"); near(W.E.tracks.hat.pan, -0.4, 1e-9, "pan");
  });

  await t("an unknown verb does not throw", function(){
    W.run("definitelynotacommand 1 2 3");
    W.run("kick zzzz");                       // an illegal pattern
  });

  /* ---- composing -------------------------------------------------------- */
  await t("compose builds a whole song", async function(){
    await W.CMDS.compose(["hardtechno", "1"]);
    W.E.stop();
    var sg = W.song;
    ok(sg && sg.order.length >= 5, "too few sections");
    ok(W.OONTZ_COMPOSE.score(W.OONTZ_COMPOSE.critique(sg)) >= 60, "arrangement graded badly");
    return sg.order.length + " sections, " + W.oontz.totalBars(sg) + " bars";
  });

  await t("phrase-length patterns really span bars", function(){
    var sg = W.song, long = null;
    sg.order.forEach(function(n){
      var sec = sg.sections[n];
      Object.keys(sec.tracks).forEach(function(k){
        var p = sec.tracks[k].pat;
        if(p && p.length > 16 && p.length % 16 === 0) long = long || {sec: n, k: k, p: p};
      });
    });
    ok(long, "the composer wrote no multi-bar pattern");
    var bars = long.p.length / 16;
    var a = W.oontz.patIndex(long.p, 0, 3), b = W.oontz.patIndex(long.p, bars - 1, 3);
    ok(a !== b, "patIndex gives the same step in different bars");
    return long.k + " spans " + bars + " bars";
  });

  /* ---- the ear: this needs a real render -------------------------------- */
  await t("the ear renders and measures every track", async function(){
    var m = await W.OONTZ_EAR.measure(W.song);
    ok(m.order.length >= 3, "measured too few tracks");
    var silent = m.order.filter(function(n){
      return m.tracks[n].reduce(function(a, b){ return a + b; }, 0) < 0.5; });
    ok(!silent.length, "these measured as silence: " + silent.join(", "));
    ok(m.master.peakDb < 0, "master peaked at " + m.master.peakDb.toFixed(2) + " dBFS");
    W.EARLAST = m;
    return m.order.length + " tracks, peak " + m.master.peakDb.toFixed(2) + " dBFS";
  });

  /* A hit that has not played yet must be SILENT.
   *
   * An AudioParam holds its default until its first scheduled event and a gain
   * defaults to 1.0, so a built-but-not-yet-played hit used to sit wide open - and a
   * WaveShaper is not silent on silence, because satCurve interpolates to a non-zero
   * value at zero input. Every pending hit therefore trickled DC into the mix.
   * Measured before the fix: 16 bars of pending kicks put a constant 0.1075 into the
   * silence ahead of them (peak == rms, so pure DC, ~0.0019 per pending hit). It
   * inflated the opening of every render and faded as the song used its notes up,
   * which is why a quiet intro came out as loud as the drop. */
  await t("a hit that has not played yet is silent", async function(){
    var R = 44100;
    var sg = W.CO.compose("techno", 1, "classic");
    sg.order = ["intro"]; sg.sections.intro.bars = 16;
    var g0 = W.OZ.gridFor(sg);
    /* three seconds of context, with every note scheduled to start at ten */
    var off = new W.OfflineAudioContext(1, 3 * R, R);
    var out = off.createGain(); out.gain.value = 0.85; out.connect(off.destination);
    var fake = new W.OZ.Engine(); fake.ctx = off; fake.groove = W.OZ.grooveOf(sg);
    var t0 = 10;
    for(var bar = 0; bar < 16; bar++){
      var st = W.OZ.stateAt(sg, bar), spb = 60 / (st.bpm || g0.bpm);
      for(var i = 0; i < 16; i++)
        fake._hits(off, out, t0 + i * spb / 4, i, st.tracks, st.order, st.bpm || g0.bpm, st.swing || 0, bar);
      t0 += 4 * spb;
    }
    var x = (await off.startRendering()).getChannelData(0);
    var e = 0, peak = 0;
    for(var k = 0; k < x.length; k++){ e += x[k] * x[k]; var v = Math.abs(x[k]); if(v > peak) peak = v; }
    var rms = Math.sqrt(e / x.length);
    ok(rms < 1e-3, "pending hits leak into the silence before them: rms " + rms.toFixed(5) +
                   ", peak " + peak.toFixed(5) + (Math.abs(peak - rms) < rms * 0.05 ? " (constant, so DC)" : ""));
    return "rms " + rms.toExponential(1) + " across 3s of nothing";
  });

  await t("the master chain enforces its own rules", async function(){
    var m = W.EARLAST;
    ok(m.master.peakDb <= -0.5, "no headroom: " + m.master.peakDb.toFixed(2) + " dBFS");
    ok(m.master.low.ratio < 0.08, "low end is not mono: " + m.master.low.ratio.toFixed(3));
    /* nothing but the low-end owners should have real sub energy */
    m.order.forEach(function(n){
      if(W.oontz.keepsLows(n)) return;
      ok(m.tracks[n][0] < 0.30, n + " has " + Math.round(m.tracks[n][0] * 100) + "% under 60Hz despite the highpass");
    });
    return "headroom, mono lows and the 60Hz highpass all hold";
  });

  await t("grade prints both halves", async function(){
    var before = W.document.getElementById("out").textContent.length;
    await W.CMDS.grade([]);
    var txt = W.document.getElementById("out").textContent.slice(before);
    ok(/arrangement \d+\/100/.test(txt), "no arrangement score");
    ok(/the mix — \d+\/100/.test(txt), "no mix score");
    ok(/dBFS/.test(txt), "no measured headroom");
  });

  await t("improve raises the mix and stops", async function(){
    var m0 = await W.OONTZ_EAR.measure(W.song);
    var s0 = W.OONTZ_COMPOSE.score(W.OONTZ_EAR.critiqueMix(m0));
    await W.CMDS.improve(["2"]);
    var m1 = await W.OONTZ_EAR.measure(W.song);
    var s1 = W.OONTZ_COMPOSE.score(W.OONTZ_EAR.critiqueMix(m1));
    ok(s1 >= s0, "improve made it worse: " + s0 + " -> " + s1);
    return s0 + " -> " + s1 + "/100";
  });

  /* ---- export ----------------------------------------------------------- */
  await t("export renders a playable WAV", async function(){
    var r = await W.oontz.renderSong(W.song);
    var blob = W.oontz.wavBlob(r.buf);
    ok(blob.size > 44, "empty wav");
    var head = new Uint8Array(await blob.slice(0, 44).arrayBuffer());
    var tag = String.fromCharCode(head[0], head[1], head[2], head[3]);
    eq(tag, "RIFF", "not a RIFF file");
    eq(String.fromCharCode(head[8], head[9], head[10], head[11]), "WAVE", "not WAVE");
    var ch = head[22] | (head[23] << 8), bits = head[34] | (head[35] << 8);
    eq(ch, r.buf.numberOfChannels, "channel count in the header is wrong");
    eq(bits, 16, "not 16-bit");
    var dataLen = head[40] | (head[41] << 8) | (head[42] << 16) | (head[43] << 24);
    eq(dataLen, r.buf.length * ch * 2, "data chunk length is wrong");
    eq(blob.size, 44 + dataLen, "file size does not match its header");
    return (blob.size / 1048576).toFixed(1) + " MB, " + r.seconds.toFixed(1) + "s";
  });

  /* ---- decks: never executed before ------------------------------------- */
  await t("a deck loads and reports a grid", async function(){
    await W.CMDS.dload(["a", "this"]);
    var D = W.E.decks();
    ok(D.a.r && D.a.r.buf, "deck A has no buffer");
    ok(D.a.r.grid.length >= 8, "no beat grid");
    near(D.a.r.grid[4] - D.a.r.grid[0], 4 * 60 / D.a.r.bpm, 1e-6, "the grid is not four beats to the bar");
    return D.a.r.grid.length + " beats, " + D.a.r.seconds.toFixed(1) + "s";
  });

  /* The deck said `rendering...` forever because every render opened an
     OfflineAudioContext nobody could close and nothing waited its turn, and because
     the graph for a whole song was built in one un-yielded loop that froze the tab
     before rendering even started. Both, from the outside. */
  await t("overlapping renders take turns and all finish", async function(){
    var sg = W.CO.compose("techno", 1, "classic"), seen = [];   /* short on purpose: three of these run back to back */
    var three = [
      W.OZ.renderSong(sg, null, {raw: true}),
      W.OZ.renderSong(sg, null, {raw: true}),
      W.OZ.renderSlice(sg, {bar: 0, bars: 1})
    ];
    var out = await Promise.all(three);
    out.forEach(function(r){ seen.push(!!(r && (r.buf || r.length))); });
    ok(seen.length === 3 && seen.every(Boolean), "a render started at the same time as another never came back");
    ok(W.OZ.renderFlight().max <= 1,
       "renders overlapped - " + W.OZ.renderFlight().max + " contexts were open at once");
    return "3 renders, max " + W.OZ.renderFlight().max + " in flight";
  });

  /* A whole song in one context is quadratic in its length - every scheduled node
     stays in the graph, so every quantum walks all of them. A deck renders in
     chunks instead, which is what makes a real track loadable at all. */
  await t("a deck render is chunked, and stays roughly linear", async function(){
    var sg = W.CO.compose("techno", 2, "classic");
    var short = W.OZ.totalBars(sg);
    var pct = [];
    var t0 = performance.now();
    var rr = await W.OZ.renderSong(sg, function(f){ pct.push(f); }, {raw: true});
    var ms = performance.now() - t0, secs = rr.seconds;

    ok(pct.length > 2, "a chunked render must report per chunk, not once at the end");
    ok(pct[pct.length - 1] === 1, "progress never reached the end");
    ok(pct.every(function(f, i){ return i === 0 || f >= pct[i - 1]; }), "progress went backwards");
    ok(rr.buf.length >= Math.floor(secs * 44100), "the stitched buffer is shorter than the song");

    /* The whole point. Before chunking this ran at ~2100ms per second of audio for a
       song this long; a chunk stays down at a few hundred. Generous ceiling so a slow
       machine passes and a return to quadratic does not. */
    var perSec = ms / secs;
    ok(perSec < 900, "a deck render is back to quadratic: " + Math.round(perSec) + "ms per second of audio");

    /* Silence would also be fast. */
    var d = rr.buf.getChannelData(0), peak = 0;
    for(var i = 0; i < d.length; i += 17) if(Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
    ok(peak > 0.05, "the stitched render is silent - peak " + peak.toFixed(3));
    return short + " bars, " + Math.round(perSec) + "ms per audio-second, peak " + peak.toFixed(2);
  });

  /* Chunking has to produce the same MUSIC as one long render - same hits, at the
     same times, at the same levels, with tails ringing across the seams instead of
     being cut off at them.
     It is deliberately not asserted sample-by-sample. It was measured that way, and
     it is not sample-identical: individual hits differ in phase detail because a
     voice is built against its own context's clock. What holds, and what a listener
     would notice if it broke, is the envelope - measured at 0.99987 correlation with
     matching RMS, against a single-context render of the same song. A dropped tail,
     a mistimed chunk or a lost hit all break that immediately. */
  await t("a chunked render is the same music as one long render", async function(){
    var R = 44100;
    var sg = W.CO.compose("techno", 1, "classic");
    sg.order = ["intro"]; sg.sections.intro.bars = 8;      /* two chunks, and cheap to render whole */
    var total = W.OZ.totalBars(sg), g0 = W.OZ.gridFor(sg);

    /* the reference: the whole thing in one context, which is what chunking replaced */
    var off = new W.OfflineAudioContext(1, Math.ceil((g0.seconds + 1.5) * R), R);
    var g = off.createGain(); g.gain.value = 0.85; g.connect(off.destination);
    var fake = new W.OZ.Engine(); fake.ctx = off; fake.groove = W.OZ.grooveOf(sg);
    var tt = 0;
    for(var bar = 0; bar < total; bar++){
      var st = W.OZ.stateAt(sg, bar), spb = 60 / (st.bpm || g0.bpm);
      for(var i = 0; i < 16; i++)
        fake._hits(off, g, tt + i * spb / 4, i, st.tracks, st.order, st.bpm || g0.bpm, st.swing || 0, bar);
      tt += 4 * spb;
    }
    var a = (await off.startRendering()).getChannelData(0);
    var b = (await W.OZ.renderSong(sg, null, {raw: true})).buf.getChannelData(0);

    function env(x){
      var Wn = Math.round(0.05 * R), out = [];
      for(var s = 0; s + Wn < x.length; s += Wn){
        var e = 0; for(var i = 0; i < Wn; i++){ var v = x[s + i]; e += v * v; }
        out.push(Math.sqrt(e / Wn));
      }
      return out;
    }
    var ea = env(a), eb = env(b), n = Math.min(ea.length, eb.length);
    var num = 0, da = 0, db = 0;
    for(var i = 0; i < n; i++){ num += ea[i] * eb[i]; da += ea[i] * ea[i]; db += eb[i] * eb[i]; }
    var corr = num / Math.sqrt(da * db);
    var rmsA = Math.sqrt(da / n), rmsB = Math.sqrt(db / n);

    ok(rmsA > 0.01, "the reference render is silent, so this proves nothing");
    ok(corr > 0.999, "chunked audio no longer tracks the single-context render: correlation " + corr.toFixed(5));
    ok(Math.abs(rmsA - rmsB) / rmsA < 0.05,
       "chunked audio changed level: " + rmsA.toFixed(4) + " vs " + rmsB.toFixed(4));
    return "corr " + corr.toFixed(5) + ", rms " + rmsA.toFixed(4) + " vs " + rmsB.toFixed(4);
  });

  await t("a gallery track that is not there says so, out loud", async function(){
    var was = W.GAL;
    W.GAL = [{id: "definitely-not-a-real-song-id"}];
    var n = ERRORS.length;
    await W.CMDS.dload(["a", "1"]);
    W.GAL = was;
    ok(ERRORS.length === n, "a missing track became an unhandled rejection: " + ERRORS.slice(n).join(" | "));
    var txt = W.document.getElementById("out").textContent;
    ok(/not public any more|could not load that one|render failed/.test(txt),
       "a missing track failed silently - nothing on screen said why");
  });

  await t("two decks sync to the same phase", async function(){
    await W.CMDS.compose(["acid", "1"]); W.E.stop();
    await W.CMDS.dload(["b", "this"]);
    var D = W.E.decks();
    ok(D.b.r, "deck B has no buffer");
    D.a.play(); D.b.play();
    W.CMDS.deck(["b", "sync"]);
    var now = W.E.ctx.currentTime + 0.05;
    near(D.b.phaseAt(now), D.a.phaseAt(now), 0.002, "phase does not match after sync");
    near(D.b.bpm(), D.a.bpm(), 0.01, "tempo does not match after sync");
    D.a.stop(); D.b.stop();
    return "rate " + D.b.rate.toFixed(4);
  });

  await t("eq kills and the crossfader moves", function(){
    W.CMDS.eq(["a", "low", "0"]);
    ok(W.E.decks().a.kill.low, "kill flag not set");
    W.CMDS.xf(["0"]);
    var g = W.oontz.xfGains(W.E.decks().xf);
    near(g[0], g[1], 1e-9, "centre is not equal");
    W.CMDS.xf(["-1"]);
    near(W.oontz.xfGains(W.E.decks().xf)[0], 1, 1e-9, "hard left is not all A");
  });

  await t("a deck loop wraps and unloops", function(){
    var d = W.E.decks().a;
    d.loopBeats(4); ok(d.loop, "no loop set");
    var len = d.loop[1] - d.loop[0];
    near(len, 4 * 60 / d.r.bpm, 1e-6, "loop is not four beats");
    d.loopBeats(0); ok(!d.loop, "loop did not clear");
  });

  await t("deck mode switches and comes back", function(){
    W.CMDS.mode(["deck"]); eq(W.MODE, "deck", "did not enter deck mode");
    ok(W.document.getElementById("hud").textContent.indexOf("A") >= 0, "deck HUD did not draw");
    W.CMDS.mode(["studio"]); eq(W.MODE, "studio", "did not return to studio");
  });

  /* The deck used to be a room with the door painted on. Entering it left focus in
     the prompt, and the global keydown handler bails on a focused prompt - so space,
     sync, loop, the crossfader and M itself all did nothing, and there was no button
     either. These four are that bug, from four directions. */
  await t("the deck keyboard is alive even though the prompt was focused", function(){
    W.IN.focus();
    W.CMDS.mode(["deck"]);
    ok(W.document.activeElement !== W.IN, "entering the deck left the prompt focused");
    var d = W.E.decks()[W.DECKFOC];
    ok(d.r, "the deck under focus has nothing loaded to play");
    var before = d.playing;
    W.dispatchEvent(new W.KeyboardEvent("keydown", {key: " ", bubbles: true}));
    ok(d.playing !== before, "space did not reach the deck");
    W.dispatchEvent(new W.KeyboardEvent("keydown", {key: " ", bubbles: true}));
    eq(d.playing, before, "space did not toggle back");
  });

  await t("M gets you out, and so does the button", function(){
    W.CMDS.mode(["deck"]);
    W.dispatchEvent(new W.KeyboardEvent("keydown", {key: "M", bubbles: true}));
    eq(W.MODE, "studio", "M did not leave the deck");
    W.CMDS.mode(["deck"]);
    var x = W.document.getElementById("deckx");
    ok(x && x.offsetParent !== null, "the deck has no visible way out");
    x.dispatchEvent(new W.PointerEvent("pointerdown", {bubbles: true}));
    eq(W.MODE, "studio", "the exit button did nothing");
  });

  await t("exit and quit mean exit on the deck", function(){
    W.CMDS.mode(["deck"]); W.run("exit");
    eq(W.MODE, "studio", "`exit` did not leave the deck");
    W.CMDS.mode(["deck"]); W.run("quit");
    eq(W.MODE, "studio", "`quit` did not leave the deck");
  });

  /* The two tests after this one query #hud .sq and #rack .st. If the exit path
     ever leaves deck state behind they fail somewhere else entirely, so prove the
     studio is whole here, where the message names the real cause. */
  /* The whole point of chunking, from the user's side: you do not wait for the
     track. The deck is playable after the FIRST chunk and the rest arrives while
     you are already mixing. Rendering runs several times faster than realtime, so
     once it has a head start the renderer never falls behind the playhead. */
  await t("a deck is playable long before the track has finished rendering", async function(){
    var sg = W.CO.compose("techno", 2, "classic");
    var whole = W.OZ.gridFor(sg);                      /* the score knows the length before any audio exists */
    var firstAt = 0, fullAt = 0, partials = 0, readyAtFirst = 0;
    var t0 = performance.now();
    var rr = await W.OZ.renderSong(sg, null, {raw: true, onPartial: function(part, ready){
      partials++;
      if(!firstAt){ firstAt = performance.now() - t0; readyAtFirst = ready; }
      ok(part.buf && part.buf.length > 0, "a partial handed over no buffer");
      /* A partial is short on AUDIO, never on knowledge: the grid, the marks and the
         length all come from the score, so scrubbing and cues work immediately. */
      near(part.seconds, whole.seconds, 1e-6, "a partial must report the FULL length, not what it has so far");
      eq(part.grid.length, whole.grid.length, "a partial must carry the whole beat grid");
      ok(part.marks.length >= 1, "a partial must carry the section marks");
      ok(ready <= part.seconds + 1e-6, "a partial claims more rendered than the track is long");
    }});
    fullAt = performance.now() - t0;

  await t("a fader moves a real AudioParam", async function(){
    W.CMDS.mode(["deck"]);
    await W.CMDS.dload(["a", "this"]);
    var d = W.E.decks().a;
    d._chain();
    /* Ask, do not wait: resume() never settles when autoplay is blocked, and awaiting
       it hangs the gate on a machine with no audio permission. */
    try { W.E.ctx.resume(); } catch(e){}
    await sleep(60);
    var live = W.E.ctx.state === "running";     /* a suspended clock never advances a ramp */
    var mx = W.document.getElementById("mixer");
    function fire(sel, v){
      var el = mx.querySelector(sel);
      ok(el, "no control matching " + sel);
      el.value = String(v); el.dispatchEvent(new W.Event("input", {bubbles: true}));
      return el;
    }

    /* level: the deck records it immediately, the gain node ramps to it */
    fire('input[aria-label="deck a level"]', 0.25);
    near(d.lvl, 0.25, 1e-9, "the level fader did not reach the deck");
    await sleep(120);
    if(live) ok(d.nodes.fader.gain.value < 0.9,
      "the level fader did not reach the gain node (" + d.nodes.fader.gain.value + ")");
    /* and it must be its OWN node, or the crossfader would wipe it on every move */
    ok(d.nodes.fader !== d.nodes.gain, "the channel fader and the crossfader share a node");
    fire('input[aria-label="deck a level"]', 1);

    /* eq: a kill is recorded on the deck and driven into the shelf */
    fire('input[aria-label="deck a low"]', 0);
    eq(d.kill.low, true, "an EQ kill was not recorded on the deck");
    await sleep(120);
    if(live) ok(d.nodes.lo.gain.value < -20, "an EQ kill did not reach the shelf (" + d.nodes.lo.gain.value + ")");
    fire('input[aria-label="deck a low"]', 1);
    eq(d.kill.low, false, "the EQ did not come back");

    /* filter: the type flips immediately, no ramp involved */
    fire('input[aria-label="deck a filter"]', -1);
    eq(d.nodes.flt.type, "lowpass", "filter left should be a low-pass");
    near(d.flt, -1, 1e-9, "the filter value did not reach the deck");
    fire('input[aria-label="deck a filter"]', 1);
    eq(d.nodes.flt.type, "highpass", "filter right should be a high-pass");
    fire('input[aria-label="deck a filter"]', 0);
    eq(d.nodes.flt.type, "lowpass", "the middle should be a wide-open low-pass");
    await sleep(60);
    if(live) ok(d.nodes.flt.frequency.value > 15000, "the middle of the filter is not out of the way");

    /* crossfader */
    fire('input[aria-label="crossfader"]', 1);
    eq(W.E.decks().xf, 1, "the crossfader did not move the engine");
    await sleep(120);
    if(live) ok(d.nodes.gain.gain.value < 0.2, "hard right should shut deck A (" + d.nodes.gain.gain.value + ")");
    fire('input[aria-label="crossfader"]', 0);

    var V = W.OONTZ_VIZ, cv = W.document.createElement("canvas");

    var cx = cv.getContext("2d", {willReadFrequently: true});

              barPhase: 0.25, section: "drop", role: "drop", within: 2, bars: 8, left: 6, next: "break",
              energy: 0.9, bands: {sub: .8, bass: .8, mid: .6, high: .5}, wave: wave, spectrum: spec,
              playing: true, kick: true, intensity: 1, pulse: 1, flash: 0.6, rush: 0.5, pass: pass || 0};
    };
    var th = V.THEMES.acid;
    var edges = function(){
      var band = 8, hits = {top: 0, bottom: 0, left: 0, right: 0};
      var px = function(x, y, w, h){
        var d = cx.getImageData(x, y, w, h).data, n = 0;
        for(var i = 0; i < d.length; i += 4) if(d[i] + d[i+1] + d[i+2] > 40) n++;
        return n;
      };
      hits.top = px(0, 0, cv.width, band);
      hits.bottom = px(0, cv.height - band, cv.width, band);
      hits.left = px(0, 0, band, cv.height);
      hits.right = px(cv.width - band, 0, band, cv.height);
      return hits;
    };

    var names = Object.keys(V.MODES), bad = [];
    names.forEach(function(name){
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.globalCompositeOperation = "source-over";
      cx.fillStyle = "#000"; cx.fillRect(0, 0, cv.width, cv.height);
      cx.globalCompositeOperation = "lighter";
      for(var n = 0; n < 90; n++) V.MODES[name](cx, frame(0), th);   /* let trails accumulate */
      cx.setTransform(1, 0, 0, 1, 0, 0);
      var e = edges();
      var dead = Object.keys(e).filter(function(k){ return e[k] === 0; });
      if(dead.length) bad.push(name + " misses " + dead.join("+"));
    });
    ok(!bad.length, bad.join(" · "));
    ok(names.length >= 14, "expected the full mode set, saw " + names.length);
    return names.length + " modes reach every edge";
  });

  await t("glow is wired to something", function(){
    var V = W.OONTZ_VIZ;
    Object.keys(V.THEMES).forEach(function(n){
      ok(typeof V.THEMES[n].glow === "number", n + " has no glow");
    });
    V.set ? V.set("glow", 0.5) : null;
    ok(V.parseParam("glow", "0.5"), "glow must be a settable parameter, not decoration");
  });

  /* ---- Phase 3: arrangement, library, undo, stems ---------------------- */
  await t("sec edits the arrangement", async function(){
    await W.CMDS.compose(["techno", "1"]); W.E.stop();
    var n0 = W.song.order.length, bars0 = W.oontz.totalBars(W.song);
    W.run("sec add drop 16");
    eq(W.song.order.length, n0 + 1, "sec add did not add a section");
    ok(W.oontz.totalBars(W.song) > bars0, "bars did not grow");
    var added = W.song.order.filter(function(x){ return W.song.sections[x].role === "drop"; }).pop();
    W.run("sec len " + added + " 32");
    eq(W.song.sections[added].bars, 32, "sec len did not resize");
    W.run("sec move " + added + " 1");
    eq(W.song.order[0], added, "sec move did not reorder");
    W.run("sec del " + added);
    eq(W.song.order.length, n0, "sec del did not remove");
    return n0 + " sections, add/len/move/del all took";
  });

  await t("sec keeps sections phrase-aligned", function(){
    W.run("sec add build 13");                    // not a multiple of 8
    var b = W.song.order.filter(function(x){ return W.song.sections[x].role === "build"; }).pop();
    eq(W.song.sections[b].bars % 8, 0, "sec add accepted " + W.song.sections[b].bars + " bars");
    W.run("sec del " + b);
  });

  await t("undo covers a typed edit, not just the AI", function(){
    var before = W.song.sections[W.song.order[0]].tracks.kick.pat;
    W.run("kick x.x.x.x.x.x.x.x.");
    var after = W.E.tracks.kick.pat;
    ok(after !== before, "the edit did not apply");
    W.run("undo");
    eq(W.song.sections[W.song.order[0]].tracks.kick.pat, before, "undo did not restore the typed edit");
  });

  await t("undo covers a mixer verb", function(){
    var g0 = W.E.tracks.hat ? (W.E.tracks.hat.gain == null ? 1 : W.E.tracks.hat.gain) : null;
    if(g0 === null) return "no hat in this song";
    W.run("gain hat 0.33");
    W.run("undo");
    near(W.E.tracks.hat.gain == null ? 1 : W.E.tracks.hat.gain, g0, 1e-9, "undo did not restore gain");
  });

  await t("the local library saves and loads by name", function(){
    W.run("name gate-test");
    W.run("save gate-test");
    var bars = W.oontz.totalBars(W.song);
    W.run("compose acid 1");
    W.run("load gate-test");
    eq(W.song.name, "gate-test", "load did not restore the saved song");
    eq(W.oontz.totalBars(W.song), bars, "the restored song has a different length");
    W.run("forget gate-test");
    return "saved, switched away, loaded back";
  });

  await t("export stems renders one channel per track", async function(){
    /* the loudest section, where everything is playing - an intro is mostly
       silence by design, and silent stems are correct there */
    var loud = W.OONTZ_EAR.loudestSection(W.song);
    var bar = W.OONTZ_EAR.barOfSection(W.song, loud.name);
    var per = await W.oontz.renderTracks(W.song, {bar: bar});
    /* The count depends on the section; what must hold is that every audible
       track gets exactly one channel and none of them come back silent. */
    var st = W.oontz.stateAt(W.song, bar);
    var audible = st.order.filter(function(n){
      var t = st.tracks[n];
      return t && t.pat && !t.mute && t.pat.replace(/[.\-]/g, "").length; });
    ok(per.names.length >= 2, "only " + per.names.length + " stems in " + loud.name);
    eq(per.names.length, Math.min(32, audible.length), "stems do not match the audible tracks");
    eq(per.buf.numberOfChannels, per.names.length, "channels do not match track count");
    var quiet = per.names.filter(function(n, i){
      var d = per.buf.getChannelData(i), peak = 0;
      for(var k = 0; k < d.length; k++){ var a2 = d[k] < 0 ? -d[k] : d[k]; if(a2 > peak) peak = a2; }
      return peak < 1e-4;
    });
    ok(!quiet.length, "these stems are silent: " + quiet.join(", "));
    return per.names.length + " stems of " + loud.name + ": " + per.names.join(", ");
  });

  await t("why answers from the theory", function(){
    var before = W.document.getElementById("out").textContent.length;
    W.run("why sidechain");
    var txt = W.document.getElementById("out").textContent.slice(before);
    ok(/ducks/.test(txt), "no explanation printed");
  });

  await t("learn starts and tracks progress", function(){
    W.CMDS.learn();
    eq(W.LESSON_AT, 0, "lesson did not start");
    var txt = W.document.getElementById("out").textContent;
    ok(/1\/\d/.test(txt), "no step counter");
  });

  await t("the log sticks to the bottom only when you are there", function(){
    var out = W.document.getElementById("out");
    out.scrollTop = 0;
    W.line("a new line while scrolled up");
    ok(out.scrollTop === 0, "the log yanked itself to the bottom");
    ok(W.document.getElementById("tail").classList.contains("on"), "no jump-to-live offered");
    W.tail();
    ok(!W.document.getElementById("tail").classList.contains("on"), "the tail button stayed up");
  });

  await t("calm and text size persist", function(){
    W.run("calm"); ok(W.document.body.classList.contains("calm"), "calm did not apply");
    W.run("calm off"); ok(!W.document.body.classList.contains("calm"), "calm did not clear");
    W.run("text 18");
    eq(W.document.documentElement.style.getPropertyValue("--size"), "18px", "text size did not apply");
    W.run("text 15");
  });

  await t("recording starts and produces data", async function(){
    if(!W.MediaRecorder) return "MediaRecorder not available in this browser";
    W.E.play();
    await W.CMDS.rec([]);
    ok(W.REC, "recorder did not start");
    await sleep(500);
    W.REC.stop();
    await sleep(400);
    W.E.stop();
    ok(!W.REC, "recorder did not clear on stop");
    return "started and stopped cleanly";
  });

  await t("nothing threw along the way", function(){
    ok(!ERRORS.length, ERRORS.join(" | "));
  });

  log("note", "");
  log(FAIL ? "fail" : "ok", "OONTZ-GATE " + (FAIL ? "FAIL" : "PASS") + " pass=" + PASS + " fail=" + FAIL);
  render();
  document.title = "OONTZ-GATE " + (FAIL ? "FAIL" : "PASS");
  report({done: true, pass: PASS, fail: FAIL});
})();
</script>
</body>
